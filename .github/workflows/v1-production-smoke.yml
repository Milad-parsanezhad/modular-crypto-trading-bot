name: ARCHIVED v1 Production Smoke — DISABLED

# Historical paper-runtime smoke test retained as an explicit fail-closed guard.
# It expected paper execution to be enabled and invoked /paper/run-once, which is
# incompatible with the current research-only governance (PAPER=false, LIVE=false).
# A future paper-execution workflow must be created under a NEW experiment ID
# only after scientific promotion authorizes it.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived-guard:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    steps:
      - name: Paper runtime remains disabled
        run: |
          echo "ARCHIVED: historical paper-runtime smoke workflow is disabled."
          echo "Current governance requires PAPER=false and LIVE=false."
          exit 1
