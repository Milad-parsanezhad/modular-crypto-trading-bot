name: v19-forward-microstructure

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Collect prospective public microstructure snapshot
        run: |
          mkdir -p artifacts/v19/forward
          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          python scripts/collect_v19_forward_microstructure.py \
            --output "artifacts/v19/forward/microstructure-${stamp}.json"
      - name: Validate no-execution contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths=sorted(Path('artifacts/v19/forward').glob('microstructure-*.json'))
          assert len(paths)==1
          z=json.loads(paths[0].read_text())
          assert z['research_status']=='PROSPECTIVE_MULTI_VENUE_MICROSTRUCTURE_COLLECTION_ONLY'
          assert z['signal_authorized'] is False
          assert z['paper_strategy_replacement_authorized'] is False
          assert z['live_execution_authorized'] is False
          assert z['collection_rule']=='prospective_only_no_backfill_no_signal'
          print({'authorized_symbol_count':z['authorized_symbol_count'],'raw_observation_count':z['raw_observation_count'],'provider_failures':len(z['provider_failures'])})
          PY
      - name: Upload immutable forward snapshot
        uses: actions/upload-artifact@v4
        with:
          name: v19-forward-microstructure-${{ github.run_id }}
          path: artifacts/v19/forward/*.json
          retention-days: 90
