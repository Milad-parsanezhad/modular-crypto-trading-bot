name: v24b-family-meta-portfolio-risk

on:
  push:
    branches: [research/v24b-family-meta-portfolio-risk]
    paths:
      - "research_bot/strategy_family_meta_v24b.py"
      - "scripts/run_v24b_family_portfolio_lab.py"
      - "tests/test_strategy_family_meta_v24b.py"
      - "docs/V24B_FAMILY_META_PORTFOLIO_PROTOCOL.md"
      - ".github/workflows/v24b-family-portfolio.yml"
  pull_request:
    paths:
      - "research_bot/strategy_family_meta_v24b.py"
      - "scripts/run_v24b_family_portfolio_lab.py"
      - "tests/test_strategy_family_meta_v24b.py"
      - "docs/V24B_FAMILY_META_PORTFOLIO_PROTOCOL.md"
      - ".github/workflows/v24b-family-portfolio.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "1"

jobs:
  v24b-integrity-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout immutable experiment SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
          clean: true
          persist-credentials: false
      - name: Verify source provenance
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: python -m pip install --no-cache-dir -e '.[dev]'
      - name: Dependency integrity
        run: python -m pip check
      - name: Run v0.24b tests plus inherited v0.24 causality tests
        run: |
          pytest -q \
            tests/test_strategy_family_meta_v24b.py \
            tests/test_strategy_meta_v24.py \
            tests/test_ml_framework_v23r.py \
            tests/test_ml_audit_v23r.py \
            tests/test_ml_audit_v23r_regressions.py

  v24b-real-data-shadow-portfolio:
    needs: v24b-integrity-tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout immutable experiment SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
          clean: true
          persist-credentials: false
      - name: Verify source provenance
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: python -m pip install --no-cache-dir -e '.[dev]'
      - name: Dependency integrity
        run: python -m pip check
      - name: Run 12-asset family-specific ML and overlap-aware portfolio shadow experiment
        run: |
          PYTHONPATH=. python scripts/run_v24b_family_portfolio_lab.py \
            --output-dir artifacts/v24b-family-portfolio \
            --symbols BTC/USDT,ETH/USDT,SOL/USDT,XRP/USDT,DOGE/USDT,ADA/USDT,LINK/USDT,LTC/USDT,BCH/USDT,TRX/USDT,AVAX/USDT,DOT/USDT \
            --bars 3600
      - name: Verify fail-closed shadow contract and portfolio controls
        run: |
          python - <<'PY'
          import json, pathlib
          root = pathlib.Path("artifacts/v24b-family-portfolio")
          d = json.loads((root / "decision.json").read_text(encoding="utf-8"))
          assert d["scientific_status"] == "EXPLORATORY_REUSED_SHADOW_NO_PROMOTION"
          assert d["forward_paper_authorized"] is False
          assert d["paper_replacement_authorized"] is False
          assert d["live_execution_authorized"] is False
          assert d["portfolio_semantics"]["overlap_aware"] is True
          assert d["portfolio_semantics"]["mark_to_market"] is False
          assert len(d["successful_symbols"]) >= 5
          assert d["family_model_count"] >= 1
          assert d["portfolio_base_shadow"]["max_open_risk_fraction_seen"] <= 0.0100000001
          assert d["portfolio_family_filter_shadow"]["max_open_risk_fraction_seen"] <= 0.0100000001
          print({
              "scientific_status": d["scientific_status"],
              "family_models": d["family_model_count"],
              "base_return": d["portfolio_base_shadow"]["total_return"],
              "filtered_return": d["portfolio_family_filter_shadow"]["total_return"],
          })
          PY
      - name: Persist exact CI provenance
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess
          root = pathlib.Path("artifacts/v24b-family-portfolio")
          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          expected = os.environ["EXPECTED_SHA"]
          assert actual == expected
          (root / "ci_provenance.json").write_text(json.dumps({
              "expected_sha": expected,
              "actual_sha": actual,
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "workflow": os.environ.get("GITHUB_WORKFLOW"),
              "status": "EXACT_EXPERIMENT_SHA_VERIFIED",
          }, indent=2), encoding="utf-8")
          PY
          python -m pip freeze --all > artifacts/v24b-family-portfolio/pip-freeze.txt
      - name: Upload complete v0.24b evidence bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v24b-family-portfolio-${{ github.run_id }}
          path: artifacts/v24b-family-portfolio/
          if-no-files-found: error
          retention-days: 30
