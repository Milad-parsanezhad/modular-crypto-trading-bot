name: v44 Preregistration and Sampling CI

on:
  pull_request:
    branches:
      - chore/workflow-governance-v43
    paths:
      - "docs/V44_INFORMATION_DRIVEN_SAMPLING_PREREGISTRATION.md"
      - "research_bot/information_sampling_v44.py"
      - "tests/test_information_sampling_v44.py"
      - ".github/workflows/v44-prereg-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prereg-v44:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      WORKFLOW_RUN_ID: ${{ github.run_id }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - name: Checkout exact scientific head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Assert checkout provenance
        run: |
          set -euo pipefail
          ACTUAL=$(git rev-parse HEAD)
          echo "expected=$EXPECTED_HEAD_SHA actual=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED_HEAD_SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install research package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Verify frozen prerequisites
        run: |
          test -f docs/V43_RESULTS_2026-09-12.md
          test -f docs/V44_INFORMATION_DRIVEN_SAMPLING_PREREGISTRATION.md
          test -f docs/GITHUB_ACTIONS_WORKFLOW_AUDIT_2026-09-12.md

      - name: Run causal sampling invariants
        run: |
          pytest -q tests/test_information_sampling_v44.py

      - name: Compile v0.44 sampling module
        run: |
          python -m py_compile research_bot/information_sampling_v44.py

      - name: Verify fail-closed manifest
        run: |
          python - <<'PY'
          from research_bot.information_sampling_v44 import preregistration_manifest_v44
          m=preregistration_manifest_v44()
          assert m['reserved_holdout']=='kraken'
          assert m['kraken_touched'] is False
          assert m['paper_execution'] is False
          assert m['live_execution'] is False
          assert m['threshold_relaxation'] is False
          assert m['outcome_based_variant_tuning'] is False
          assert m['outcome_based_asset_pruning'] is False
          assert m['transformer_or_rl_added'] is False
          assert m['true_tick_volume_dollar_bars_claimed'] is False
          assert len(m['variants_in_frozen_order']) == 3
          PY

      - name: Enforce preregistration-only state
        run: |
          set -euo pipefail
          test ! -f scripts/run_v44_information_sampling_characterization.py
          test ! -f scripts/prepare_v44_information_sampling_data.py
          test ! -f scripts/run_v44_fold_from_prepared.py
          test ! -f scripts/finalize_v44_from_folds.py
          echo "v0.44 empirical execution is blocked until this preregistration snapshot is frozen."

      - name: Write execution provenance
        run: |
          mkdir -p artifacts/v44-prereg
          python - <<'PY'
          import hashlib, json, os, platform, subprocess
          from importlib.metadata import version
          from pathlib import Path

          prereg = Path('docs/V44_INFORMATION_DRIVEN_SAMPLING_PREREGISTRATION.md')
          payload = {
              'workflow_run_id': os.environ['WORKFLOW_RUN_ID'],
              'event_name': os.environ['EVENT_NAME'],
              'event_head_sha': os.environ['EXPECTED_HEAD_SHA'],
              'checked_out_sha': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
              'python': platform.python_version(),
              'package': version('modular-crypto-research-bot'),
              'numpy': version('numpy'),
              'pandas': version('pandas'),
              'scikit_learn': version('scikit-learn'),
              'ccxt': version('ccxt'),
              'preregistration_sha256': hashlib.sha256(prereg.read_bytes()).hexdigest(),
              'empirical_runner_present': False,
              'kraken_touched': False,
              'paper_execution': False,
              'live_execution': False,
          }
          Path('artifacts/v44-prereg/execution_provenance.json').write_text(
              json.dumps(payload, indent=2, sort_keys=True), encoding='utf-8'
          )
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Upload frozen preregistration provenance
        uses: actions/upload-artifact@v4
        with:
          name: v44-preregistration-provenance
          path: artifacts/v44-prereg/
          if-no-files-found: error
          retention-days: 90
