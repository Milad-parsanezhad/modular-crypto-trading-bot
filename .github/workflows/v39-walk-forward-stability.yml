name: v39-walk-forward-stability
on:
  push:
    branches: [research/v39-walk-forward-stability]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  walk-forward:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Verify v0.39 invariants
        run: python -m pytest -q tests/test_walk_forward_v39.py tests/test_soft_portfolio_v38.py tests/test_kraken_holdout_v34.py
      - name: Wait for frozen v0.38 run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 120); do
            status=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/parsa314/modular-crypto-trading-bot/actions/runs/34642791984 | python -c 'import json,sys; x=json.load(sys.stdin); print(x.get("status",""), x.get("conclusion") or "")')
            echo "$status"
            case "$status" in
              "completed success") exit 0 ;;
              completed*) echo "v0.38 did not complete successfully"; exit 1 ;;
            esac
            sleep 15
          done
          exit 1
      - uses: actions/download-artifact@v4
        with:
          name: v38-soft-portfolio
          path: frozen-v38
          github-token: ${{ github.token }}
          repository: parsa314/modular-crypto-trading-bot
          run-id: 34642791984
      - name: Run v0.39 walk-forward stability
        run: python scripts/run_v39_walk_forward.py --v38-artifact-dir frozen-v38 --output-dir artifacts/v39-walk-forward
      - name: Print v0.39 decision
        run: cat artifacts/v39-walk-forward/decision_v39.json
      - uses: actions/upload-artifact@v4
        with:
          name: v39-walk-forward-stability
          path: artifacts/v39-walk-forward
          retention-days: 90
