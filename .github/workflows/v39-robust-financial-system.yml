name: v39 Robust Financial System CI

on:
  pull_request:
    branches:
      - research/v39r-canonical-reconstruction
  workflow_dispatch:

jobs:
  test-v39-financial-system:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run v0.39 financial-system invariants
        run: pytest -q tests/test_financial_system_v39.py

      - name: Verify v0.39 manifest is importable
        run: |
          python - <<'PY'
          from research_bot.financial_system_v39 import preregistration_manifest_v39
          m = preregistration_manifest_v39()
          assert m['kraken_touched'] is False
          assert m['paper_execution'] is False
          assert m['live_execution'] is False
          print(m)
          PY
