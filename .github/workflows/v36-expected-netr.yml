name: v36-expected-netr

on:
  push:
    branches: ["research/v36-expected-netr"]
    paths:
      - "research_bot/event_utility_v36.py"
      - "scripts/run_v36_expected_netr.py"
      - "tests/test_event_utility_v36.py"
      - "docs/V36_EXPECTED_NETR_PROTOCOL.md"
      - ".github/workflows/v36-expected-netr.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  expected-netr-development:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install research package
        run: python -m pip install -e '.[dev]'
      - name: Verify v0.36 and inherited fail-closed invariants
        run: |
          python -m pytest -q \
            tests/test_event_utility_v36.py \
            tests/test_drawdown_firewall_v31.py \
            tests/test_breadth_stability_v33.py \
            tests/test_kraken_holdout_v34.py \
            tests/test_asymmetric_meta_v35.py
      - name: Download frozen v0.30 snapshots
        uses: actions/download-artifact@v4
        with:
          name: v30-regime-event-alpha
          path: frozen-v30
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34632401230
      - name: Download frozen v0.31 KuCoin evidence
        uses: actions/download-artifact@v4
        with:
          name: v31-drawdown-firewall
          path: frozen-v31
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34633572528
      - name: Download Kraken seal evidence
        uses: actions/download-artifact@v4
        with:
          name: v34-kraken-holdout
          path: frozen-v34
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34635635582
      - name: Download frozen v0.35 rejection
        uses: actions/download-artifact@v4
        with:
          name: v35-asymmetric-meta
          path: frozen-v35
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34637596442
      - name: Run v0.36 expected net-R development screen
        run: |
          python scripts/run_v36_expected_netr.py \
            --v30-artifact-dir frozen-v30 \
            --v31-artifact-dir frozen-v31 \
            --v34-artifact-dir frozen-v34 \
            --v35-artifact-dir frozen-v35 \
            --output-dir artifacts/v36-expected-netr
      - name: Print v0.36 decision and summary
        run: |
          cat artifacts/v36-expected-netr/decision_v36.json
          python - <<'PY'
          import pandas as pd
          p='artifacts/v36-expected-netr/development_summary_v36.csv'
          print(pd.read_csv(p).to_string(index=False))
          PY
      - name: Upload v0.36 evidence
        uses: actions/upload-artifact@v4
        with:
          name: v36-expected-netr
          path: artifacts/v36-expected-netr
          retention-days: 90
