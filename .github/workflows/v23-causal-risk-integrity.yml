name: v23-causal-risk-integrity

on:
  pull_request:
    paths:
      - "research_bot/risk_causality_v23.py"
      - "tests/test_risk_causality_v23.py"
      - ".github/workflows/v23-causal-risk-integrity.yml"
  push:
    branches:
      - "research/v20-global-strategy-risk-lab"
    paths:
      - "research_bot/risk_causality_v23.py"
      - "tests/test_risk_causality_v23.py"
      - ".github/workflows/v23-causal-risk-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  causal-risk-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install research package
        run: python -m pip install -e '.[dev]'
      - name: Run v0.23 causal overlap regression
        run: python -m pytest -q tests/test_risk_causality_v23.py
      - name: Emit standalone audit evidence
        run: python -m research_bot.risk_causality_v23 | tee v23-causal-risk-audit.json
      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: v23-causal-risk-integrity
          path: v23-causal-risk-audit.json
          retention-days: 30
