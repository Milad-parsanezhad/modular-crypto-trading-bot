name: v22b-ict-vision-ablation

on:
  push:
    branches: [research/v22-ict-vision-lab]
    paths:
      - "research_bot/vision_ablation_v22b.py"
      - "scripts/run_v22b_ict_vision_ablation.py"
      - "tests/test_vision_ablation_v22b.py"
      - ".github/workflows/v22b-ict-vision-ablation.yml"
  pull_request:
    paths:
      - "research_bot/vision_ablation_v22b.py"
      - "scripts/run_v22b_ict_vision_ablation.py"
      - "tests/test_vision_ablation_v22b.py"
      - ".github/workflows/v22b-ict-vision-ablation.yml"
  workflow_dispatch:

jobs:
  ablation-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Channel-ablation, class-balance and fail-closed gate tests
        run: pytest -q tests/test_vision_ablation_v22b.py

  balanced-vision-ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev,deep]'
      - name: Run raw-vs-Ichimoku-vs-ICT structural ablation
        run: |
          PYTHONPATH=. python scripts/run_v22b_ict_vision_ablation.py \
            --output-dir artifacts/v22b-ict-vision-ablation \
            --symbols BTC/USDT,ETH/USDT,SOL/USDT \
            --timeframe 4h \
            --bars 4000 \
            --lookback 64 \
            --height 64 \
            --width 96 \
            --max-samples-per-symbol 600 \
            --epochs 5 \
            --architectures small_cnn,small_vit \
            --channel-modes raw_candles,raw_plus_ichimoku,structure_augmented
      - name: Upload v0.22b ablation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v22b-ict-vision-ablation
          path: artifacts/v22b-ict-vision-ablation/
          if-no-files-found: warn
          retention-days: 30
