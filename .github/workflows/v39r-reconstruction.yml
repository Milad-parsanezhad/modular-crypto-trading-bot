name: v39R Reconstruction CI

on:
  pull_request:
    branches:
      - research/v38-temporal-consensus
  workflow_dispatch:

jobs:
  test-v39r:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run v0.39R tests
        run: pytest -q tests/test_canonical_strategy_v39r.py

      - name: Run deterministic reconstruction smoke
        run: python scripts/run_v39r_reconstruction_smoke.py
