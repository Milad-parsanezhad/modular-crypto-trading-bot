name: v0.49 Conditional Concept Drift Diagnostic

on:
  pull_request:
    paths:
      - 'research_bot/conditional_concept_drift_v49.py'
      - 'scripts/run_v49_conditional_concept_drift.py'
      - 'tests/test_conditional_concept_drift_v49.py'
      - 'docs/V49_CONDITIONAL_CONCEPT_DRIFT_RESEARCH_2026-09-12.md'
      - 'docs/V49_CONDITIONAL_CONCEPT_DRIFT_PREREGISTRATION.md'
      - '.github/workflows/v49-conditional-concept-drift.yml'
  workflow_dispatch:

concurrency:
  group: v49-conditional-drift-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  EXPECTED_PREREG_HEAD: 4c6081504b57f8ed513a2d8445e6d17b3230b7a4
  CANONICAL_V47_HEAD: 802b0cde38549617589b6a4a313949361dd9425c
  SOURCE_V44_RUN: '34700944062'
  SOURCE_V47_RUN: '34705324352'
  SOURCE_V48_RUN: '34706819566'

jobs:
  diagnostic-v49:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact scientific head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact head and frozen prereg lineage
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL=$(git rev-parse HEAD)
          EXPECTED='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$ACTUAL" = "$EXPECTED"
          git cat-file -e "$EXPECTED_PREREG_HEAD^{commit}"
          git merge-base --is-ancestor "$EXPECTED_PREREG_HEAD" "$ACTUAL"
          grep -q 'PREREGISTERED BEFORE ANY v0.49 EMPIRICAL EXECUTION' docs/V49_CONDITIONAL_CONCEPT_DRIFT_PREREGISTRATION.md
          grep -q 'V48_NONSTATIONARITY_EVIDENCE_INCONCLUSIVE' docs/V48_RESULTS_2026-09-12.md

      - name: Verify inherited v0.47 scientific predictor is unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code "$CANONICAL_V47_HEAD" HEAD -- \
            research_bot/economic_state_v46.py \
            research_bot/probability_calibration_v47.py \
            research_bot/event_competing_risk_v41.py \
            research_bot/asset_crossvenue_v43.py \
            scripts/run_v47_probability_calibration.py \
            scripts/run_v47_probability_calibration_compat.py

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip

      - name: Install package and test runner
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
          pip check
          python - <<'PY'
          import numpy, pandas, scipy, sklearn
          print('numpy', numpy.__version__)
          print('pandas', pandas.__version__)
          print('scipy', scipy.__version__)
          print('sklearn', sklearn.__version__)
          PY

      - name: Run frozen v0.49 tests
        run: pytest -q tests/test_conditional_concept_drift_v49.py tests/test_probability_calibration_v47.py tests/test_economic_state_v46.py

      - name: Download exact canonical v0.44 prepared evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: v44-prepared-data
          path: work/v44
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_V44_RUN }}

      - name: Download exact canonical v0.47 evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: v47-probability-calibration
          path: work/v47
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_V47_RUN }}

      - name: Verify source artifacts and safety guards
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          def sha(path):
              h=hashlib.sha256()
              with path.open('rb') as f:
                  for c in iter(lambda:f.read(1024*1024), b''):
                      h.update(c)
              return h.hexdigest()
          v44=Path('work/v44')
          for name in ['events_v44.pkl.gz','fold_index_v44.csv','prepared_hashes_v44.json','prep_status_v44.json']:
              assert (v44/name).is_file(), name
          hashes=json.loads((v44/'prepared_hashes_v44.json').read_text())
          assert sha(v44/'events_v44.pkl.gz') == hashes['events_v44_pickle_sha256']
          status=json.loads((v44/'prep_status_v44.json').read_text())
          assert status['status']=='READY'
          assert status['kraken_touched'] is False
          assert status['paper_execution'] is False
          assert status['live_execution'] is False

          v47=Path('work/v47')
          for name in ['decision_v47.json','execution_provenance_v47.json','support_manifest_v47.csv','forecast_metrics_v47.csv','post_governor_trades_v47.csv.gz','output_hashes_v47.json']:
              assert (v47/name).is_file(), name
          prov=json.loads((v47/'execution_provenance_v47.json').read_text())
          assert int(prov['workflow_run_id']) == 34705324352
          assert prov['head_sha'] == '802b0cde38549617589b6a4a313949361dd9425c'
          assert prov['kraken_touched'] is False
          d=json.loads((v47/'decision_v47.json').read_text())
          assert d['decision']=='V47_CALIBRATION_REJECT_OR_INSUFFICIENT_EVIDENCE'
          assert d['kraken_touched'] is False
          PY

      - name: Execute frozen v0.49 diagnostic
        run: |
          python scripts/run_v49_conditional_concept_drift.py \
            --v44-dir work/v44 \
            --v47-dir work/v47 \
            --output-dir results/v49_conditional_concept_drift

      - name: Write execution provenance and output hashes
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          out=Path('results/v49_conditional_concept_drift')
          prov={
            'workflow_run_id': os.environ.get('GITHUB_RUN_ID'),
            'workflow_attempt': os.environ.get('GITHUB_RUN_ATTEMPT'),
            'head_sha': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
            'prereg_head': os.environ['EXPECTED_PREREG_HEAD'],
            'source_v44_run': int(os.environ['SOURCE_V44_RUN']),
            'source_v47_run': int(os.environ['SOURCE_V47_RUN']),
            'source_v48_run': int(os.environ['SOURCE_V48_RUN']),
            'base_model_fit_partition': 'FIT_ONLY',
            'temperature_fit_partition': 'FULL_CAL_ONLY',
            'test_labels_used_for_model_or_calibrator_fit': False,
            'candidate_promotion_allowed': False,
            'kraken_touched': False,
            'paper_execution': False,
            'live_execution': False,
          }
          (out/'execution_provenance_v49.json').write_text(json.dumps(prov,indent=2,sort_keys=True))
          def sha(path):
              h=hashlib.sha256()
              with path.open('rb') as f:
                  for c in iter(lambda:f.read(1024*1024), b''):
                      h.update(c)
              return h.hexdigest()
          hashes={}
          for p in sorted(out.iterdir()):
              if p.is_file() and p.name!='output_hashes_v49.json':
                  hashes[p.name]=sha(p)
          (out/'output_hashes_v49.json').write_text(json.dumps(hashes,indent=2,sort_keys=True))
          PY

      - name: Verify canonical output contract
        shell: bash
        run: |
          set -euo pipefail
          for f in decision_v49.json unit_conditional_drift_v49.csv fold_conditional_tests_v49.csv linkage_v49.csv context_decomposition_v49.csv execution_provenance_v49.json output_hashes_v49.json; do
            test -f "results/v49_conditional_concept_drift/$f"
          done
          python - <<'PY'
          import json
          d=json.load(open('results/v49_conditional_concept_drift/decision_v49.json'))
          allowed={
            'V49_INVALID_INSUFFICIENT_DIAGNOSTIC_SUPPORT',
            'V49_CONDITIONAL_INSTABILITY_SUPPORTED',
            'V49_CONDITIONAL_SHIFT_PRESENT_LINK_INCONCLUSIVE',
            'V49_RESIDUAL_PROCESS_SHIFT_ONLY',
            'V49_CONDITIONAL_INSTABILITY_NOT_SUPPORTED',
            'V49_CONDITIONAL_INSTABILITY_EVIDENCE_INCONCLUSIVE',
          }
          assert d['decision'] in allowed
          assert d['candidate_promotion_allowed'] is False
          assert d['kraken_touched'] is False
          assert d['paper_execution'] is False
          assert d['live_execution'] is False
          assert d['post_result_pruning'] is False
          assert d['test_labels_used_for_model_or_calibrator_fit'] is False
          PY

      - name: Upload canonical v0.49 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v49-conditional-concept-drift
          path: results/v49_conditional_concept_drift/
          if-no-files-found: error
          retention-days: 90
