name: v22d-multimodal-fusion

on:
  push:
    branches: [research/v22-ict-vision-lab]
    paths:
      - "research_bot/scientific_liquidity_wyckoff_v22d.py"
      - "research_bot/multimodal_fusion_v22d.py"
      - "scripts/run_v22d_multimodal_fusion.py"
      - "tests/test_scientific_liquidity_wyckoff_v22d.py"
      - "tests/test_multimodal_fusion_v22d.py"
      - "tests/test_ict_localization_v22c.py"
      - ".github/workflows/v22d-multimodal-fusion.yml"
  pull_request:
    paths:
      - "research_bot/scientific_liquidity_wyckoff_v22d.py"
      - "research_bot/multimodal_fusion_v22d.py"
      - "scripts/run_v22d_multimodal_fusion.py"
      - "tests/test_scientific_liquidity_wyckoff_v22d.py"
      - "tests/test_multimodal_fusion_v22d.py"
      - "tests/test_ict_localization_v22c.py"
      - ".github/workflows/v22d-multimodal-fusion.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "1"

jobs:
  scientific-feature-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout immutable event SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
          clean: true
          persist-credentials: false
      - name: Verify checkout provenance
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install isolated multimodal dependencies
        run: python -m pip install --no-cache-dir -e '.[dev,deep]'
      - name: Dependency integrity
        run: python -m pip check
      - name: Localization dependency plus causal feature and multimodal fail-closed tests
        run: |
          pytest -q \
            tests/test_ict_localization_v22c.py \
            tests/test_scientific_liquidity_wyckoff_v22d.py \
            tests/test_multimodal_fusion_v22d.py

  multimodal-ablation:
    needs: scientific-feature-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout immutable event SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
          clean: true
          persist-credentials: false
      - name: Verify checkout provenance
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install isolated multimodal dependencies
        run: python -m pip install --no-cache-dir -e '.[dev,deep]'
      - name: Dependency integrity
        run: python -m pip check
      - name: Run raw-chart vs numerical vs multimodal ablation
        run: |
          PYTHONPATH=. python scripts/run_v22d_multimodal_fusion.py \
            --output-dir artifacts/v22d-multimodal-fusion \
            --symbols BTC/USDT,ETH/USDT,SOL/USDT \
            --timeframe 4h \
            --bars 3600 \
            --lookback 64 \
            --height 64 \
            --width 96 \
            --max-samples-per-symbol 480 \
            --epochs 6
      - name: Persist exact source provenance and fail-closed semantics
        run: |
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          python - <<'PY'
          import json, os, pathlib, subprocess
          root = pathlib.Path("artifacts/v22d-multimodal-fusion")
          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          expected = os.environ["EXPECTED_SHA"]
          assert actual == expected
          decision_path = root / "decision.json"
          if decision_path.exists():
              decision = json.loads(decision_path.read_text(encoding="utf-8"))
              assert not decision.get("live_execution_authorized", False), decision
          (root / "ci_provenance.json").write_text(json.dumps({"expected_sha": expected, "actual_sha": actual, "run_id": os.environ.get("GITHUB_RUN_ID")}, indent=2), encoding="utf-8")
          PY
      - name: Upload v0.22d evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v22d-multimodal-fusion-${{ github.run_id }}
          path: artifacts/v22d-multimodal-fusion/
          if-no-files-found: error
          retention-days: 30
