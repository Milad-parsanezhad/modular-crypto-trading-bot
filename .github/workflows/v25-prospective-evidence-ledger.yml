name: v25-prospective-evidence-ledger

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v25-prospective-evidence-ledger.yml"
  workflow_dispatch:
  schedule:
    # GitHub schedules run only from the default branch. Offset from minute 0 to
    # reduce documented delay/drop risk during peak scheduler load.
    - cron: "23 0,4,8,12,16,20 * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: v25-prospective-evidence-ledger
  cancel-in-progress: false

env:
  # Scientific freeze: scheduled collection executes this exact reviewed/green
  # collector commit, never the moving tip of main or a research branch.
  FROZEN_COLLECTOR_SHA: "fac456ccc0eb445ce7f2d8554840f37da9142ac7"
  V24B_RUN_ID: "34578494059"
  V24B_ARTIFACT: "v24b-family-portfolio-34578494059"
  V25_RANK_RUN_ID: "34590214474"
  V25_RANK_ARTIFACT: "v25-risk-aware-ranking-34590214474"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "1"

jobs:
  prospective-ledger:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout exact frozen collector
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.FROZEN_COLLECTOR_SHA }}
          fetch-depth: 1
          clean: true
          persist-credentials: false

      - name: Verify collector identity
        run: |
          test "$(git rev-parse HEAD)" = "${FROZEN_COLLECTOR_SHA}"
          printf '%s\n' "${GITHUB_SHA}" > /tmp/scheduler_main_sha.txt

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install exact research environment
        run: |
          python -m pip install --no-cache-dir -e '.[dev]'
          python -m pip install --no-cache-dir --upgrade --force-reinstall \
            'numpy==2.5.3' \
            'pandas==3.0.5' \
            'scikit-learn==1.9.1' \
            'joblib==1.6.0' \
            'scipy==1.18.1' \
            'threadpoolctl==3.6.0' \
            'cloudpickle==3.1.2'
          python -m pip check

      - name: Download immutable event filters and frozen ranker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf frozen/v24b frozen/v25
          mkdir -p frozen/v24b frozen/v25
          gh run download "${V24B_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --name "${V24B_ARTIFACT}" --dir frozen/v24b
          gh run download "${V25_RANK_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --name "${V25_RANK_ARTIFACT}" --dir frozen/v25
          test -f frozen/v24b/family_validation_frozen_champions.joblib
          test -f frozen/v24b/strategy_event_dataset.csv
          test -f frozen/v25/ranker_snapshot.joblib
          test -f frozen/v25/ranker_manifest.json
          test -f frozen/v25/decision.json

      - name: Recover previous accepted evidence link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf previous
          mkdir -p previous
          WORKFLOW="v25-prospective-evidence-ledger.yml"
          BRANCH="main"
          PREV_RUN=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW}/runs?branch=${BRANCH}&status=completed&per_page=30" \
            --jq ".workflow_runs[] | select(.id != ${GITHUB_RUN_ID}) | select(.conclusion == \"success\") | .id" 2>/dev/null | head -n 1 || true)
          PREVIOUS_ARG=""
          PREV_DIGEST=""
          PREV_DECISION_SHA=""
          if [ -n "${PREV_RUN}" ]; then
            PREV_ARTIFACT="v25-prospective-evidence-ledger-${PREV_RUN}"
            gh run download "${PREV_RUN}" --repo "${GITHUB_REPOSITORY}" --name "${PREV_ARTIFACT}" --dir previous || true
            PREV_DIGEST=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${PREV_RUN}/artifacts" \
              --jq ".artifacts[] | select(.name == \"${PREV_ARTIFACT}\") | .digest" 2>/dev/null | head -n 1 || true)
          fi
          if [ -f previous/decision.json ]; then
            PREVIOUS_ARG="--previous-dir previous"
            PREV_DECISION_SHA=$(sha256sum previous/decision.json | awk '{print $1}')
          else
            PREV_RUN=""
          fi
          {
            echo "PREVIOUS_ARG=${PREVIOUS_ARG}"
            echo "PREVIOUS_RUN_ID=${PREV_RUN}"
            echo "PREVIOUS_ARTIFACT_DIGEST=${PREV_DIGEST}"
            echo "PREVIOUS_DECISION_SHA256=${PREV_DECISION_SHA}"
          } >> "${GITHUB_ENV}"

      - name: Prospective causality and first-look regression tests
        run: |
          python -m pytest -q \
            tests/test_future_evidence_v25.py \
            tests/test_frozen_snapshot_v24d.py \
            tests/test_risk_ranker_v25.py

      - name: Collect blinded snapshot or execute the one permitted mature read
        run: |
          python scripts/run_v25_future_snapshot.py \
            --v24b-dir frozen/v24b \
            --v25-dir frozen/v25 \
            --output-dir artifacts/v25-prospective-evidence \
            ${PREVIOUS_ARG}

      - name: Verify fail-closed scientific state
        run: |
          python - <<'PY'
          import json
          d=json.load(open('artifacts/v25-prospective-evidence/decision.json', encoding='utf-8'))
          assert d.get('forward_paper_authorized') is False, d
          assert d.get('paper_replacement_authorized') is False, d
          assert d.get('live_execution_authorized') is False, d
          state=d.get('state')
          terminal={'FUTURE_ALLOCATOR_GATE_PASS_PRE_SEARCH_AUDIT','FUTURE_ALLOCATOR_GATE_FAIL'}
          if state in terminal:
              assert d.get('sample_spent') is True, d
              assert d.get('first_mature_read_is_terminal') is True, d
          elif state != 'WAITING_FOR_FUTURE_BOUNDARY':
              assert d.get('economics_blinded') is True, d
              assert d.get('sample_spent') is False, d
          PY

      - name: Create cryptographic evidence-chain link
        run: |
          mkdir -p artifacts/v25-prospective-evidence
          cp /tmp/scheduler_main_sha.txt artifacts/v25-prospective-evidence/scheduler_main_sha.txt
          printf '%s\n' "${FROZEN_COLLECTOR_SHA}" > artifacts/v25-prospective-evidence/frozen_collector_sha.txt
          printf '%s\n' "${GITHUB_RUN_ID}" > artifacts/v25-prospective-evidence/workflow_run_id.txt
          printf '%s\n' "${PREVIOUS_RUN_ID}" > artifacts/v25-prospective-evidence/previous_run_id.txt
          printf '%s\n' "${PREVIOUS_ARTIFACT_DIGEST}" > artifacts/v25-prospective-evidence/previous_artifact_digest.txt
          printf '%s\n' "${PREVIOUS_DECISION_SHA256}" > artifacts/v25-prospective-evidence/previous_decision_sha256.txt
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import json, os
          out=Path('artifacts/v25-prospective-evidence')
          prev=Path('previous')
          def digest(p):
              h=sha256()
              with p.open('rb') as f:
                  for b in iter(lambda:f.read(1024*1024), b''):
                      h.update(b)
              return h.hexdigest()
          link={
              'version':'v0.25-prospective-evidence-chain-v1',
              'run_id':os.environ['GITHUB_RUN_ID'],
              'scheduler_main_sha':os.environ['GITHUB_SHA'],
              'frozen_collector_sha':os.environ['FROZEN_COLLECTOR_SHA'],
              'previous_run_id':os.environ.get('PREVIOUS_RUN_ID') or None,
              'previous_artifact_digest':os.environ.get('PREVIOUS_ARTIFACT_DIGEST') or None,
              'previous_decision_sha256':os.environ.get('PREVIOUS_DECISION_SHA256') or None,
              'previous_chain_link_sha256':digest(prev/'chain_link.json') if (prev/'chain_link.json').is_file() else None,
              'current_decision_sha256':digest(out/'decision.json'),
              'current_identity_sha256':digest(out/'future_snapshot_identity.json') if (out/'future_snapshot_identity.json').is_file() else None,
          }
          (out/'chain_link.json').write_text(json.dumps(link, indent=2, sort_keys=True)+'\n', encoding='utf-8')
          rows=[]
          for p in sorted(out.rglob('*')):
              if p.is_file() and p.name != 'ARTIFACT_MANIFEST.sha256':
                  rows.append(f"{digest(p)}  {p.relative_to(out).as_posix()}")
          (out/'ARTIFACT_MANIFEST.sha256').write_text('\n'.join(rows)+'\n', encoding='utf-8')
          PY

      - name: Record defense-grade environment provenance
        if: always()
        run: |
          mkdir -p artifacts/v25-prospective-evidence
          printf '%s\n' "${V24B_RUN_ID}" > artifacts/v25-prospective-evidence/frozen_v24b_source_run.txt
          printf '%s\n' "${V25_RANK_RUN_ID}" > artifacts/v25-prospective-evidence/frozen_ranker_source_run.txt
          python -m pip freeze --all > artifacts/v25-prospective-evidence/pip-freeze.txt

      - name: Upload immutable prospective evidence ledger
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: v25-prospective-evidence-ledger-${{ github.run_id }}
          path: artifacts/v25-prospective-evidence/
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
