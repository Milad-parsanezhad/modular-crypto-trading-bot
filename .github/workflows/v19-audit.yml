name: v19-audit-corrected-research

on:
  push:
    branches: ["v19-audit-corrected-forward-microstructure"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  audit-and-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run deterministic audit tests
        run: |
          pytest -q tests/test_audit_v19.py tests/test_forward_microstructure_v19.py tests/test_v19_collector_helpers.py tests/test_forward_paper_v14.py tests/test_cost_regime_v18.py tests/test_evidence_ledger_v17.py tests/test_trial_registry_v17.py
      - name: Run audit-corrected public-data research
        run: |
          python scripts/run_v19_audit.py --bars 1800 --output artifacts/v19/v19_audit.json --markdown artifacts/v19/V19_AUDIT_RESULTS.md
      - name: Smoke prospective multi-venue collector
        run: |
          python scripts/collect_v19_forward_microstructure.py --output artifacts/v19/forward_microstructure_snapshot.json
      - name: Validate fail-closed scientific contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          audit=json.loads(Path('artifacts/v19/v19_audit.json').read_text())
          snap=json.loads(Path('artifacts/v19/forward_microstructure_snapshot.json').read_text())
          assert audit['live_execution_authorized'] is False
          assert audit['paper_strategy_replacement_authorized'] is False
          assert audit['cost_audit']['promotion_authorized'] is False
          assert audit['regime_audit']['promotion_authorized'] is False
          assert audit['cost_audit']['evidence_status']=='REFRESHED_RECONSTRUCTION_AUDIT_NOT_ORIGINAL_V18_SAMPLE'
          assert audit['cost_audit']['original_v18_raw_dataset_recoverable'] is False
          assert snap['signal_authorized'] is False
          assert snap['paper_strategy_replacement_authorized'] is False
          assert snap['live_execution_authorized'] is False
          assert len(audit['manifest_sha256']) == 64
          assert len(snap['snapshot_sha256']) == 64
          for row in snap['symbols']:
              if row.get('feature_authorized'):
                  assert row['venue_clock_skew_seconds'] <= snap['config']['max_venue_clock_skew_seconds']
          print('v0.19 fail-closed contract validated')
          PY
      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: v19-audit-corrected-results
          path: |
            artifacts/v19/v19_audit.json
            artifacts/v19/V19_AUDIT_RESULTS.md
            artifacts/v19/forward_microstructure_snapshot.json
          retention-days: 90
