name: v53-ontology-integrity

on:
  push:
    branches: ["research/v53-multiframework-confluence-prereg"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  ontology-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run v0.53 ontology and no-lookahead tests
        run: |
          pytest -q tests/test_multiframework_features_v53.py
      - name: Enforce ontology manifest and Chikou safety
        run: |
          python - <<'PY'
          from pathlib import Path
          from research_bot.ontology_v53 import ontology_by_id, output_to_concept
          from research_bot.multiframework_features_v53 import V53FeatureConfig

          registry = ontology_by_id()
          assert len(registry) >= 20
          assert len(output_to_concept()) >= 40
          src = Path("research_bot/multiframework_features_v53.py").read_text()
          assert "shift(-26)" not in src
          assert "shift(- 26)" not in src
          cfg = V53FeatureConfig()
          assert cfg.swing_right > 0
          print(f"v0.53 ontology validated: {len(registry)} concepts")
          PY
