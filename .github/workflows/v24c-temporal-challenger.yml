name: v24c-temporal-challenger

on:
  push:
    branches: [research/v24c-multiplan-ml-validation]
    paths:
      - "research_bot/temporal_meta_v24c.py"
      - "scripts/run_v24c_temporal_challenger.py"
      - "tests/test_v24c_external_mtm_temporal.py"
      - ".github/workflows/v24c-temporal-challenger.yml"
  pull_request:
    paths:
      - "research_bot/temporal_meta_v24c.py"
      - "scripts/run_v24c_temporal_challenger.py"
      - "tests/test_v24c_external_mtm_temporal.py"
      - ".github/workflows/v24c-temporal-challenger.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "1"

jobs:
  temporal-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact experiment SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
          clean: true
          persist-credentials: false
      - name: Verify provenance
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install deep research stack
        run: python -m pip install --no-cache-dir -e '.[dev,deep]'
      - name: Dependency audit
        run: python -m pip check
      - name: Temporal causality regression
        run: pytest -q tests/test_v24c_external_mtm_temporal.py::test_temporal_sequence_is_unchanged_by_future_mutation tests/test_deep_temporal_v22.py
      - name: Run development/validation-only LSTM-GRU-TCN-CNNLSTM-Transformer tournament
        run: python scripts/run_v24c_temporal_challenger.py --output-dir artifacts/v24c-temporal-challenger
      - name: Record environment
        if: always()
        run: |
          mkdir -p artifacts/v24c-temporal-challenger
          printf '%s\n' "${EXPECTED_SHA}" > artifacts/v24c-temporal-challenger/source_commit.txt
          python -m pip freeze --all > artifacts/v24c-temporal-challenger/pip-freeze.txt
      - name: Upload temporal evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v24c-temporal-challenger-${{ github.run_id }}
          path: artifacts/v24c-temporal-challenger/
          if-no-files-found: error
          retention-days: 30
