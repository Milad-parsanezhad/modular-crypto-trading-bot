name: v31-drawdown-firewall

on:
  push:
    branches:
      - "research/v31-drawdown-firewall"
    paths:
      - "research_bot/drawdown_firewall_v31.py"
      - "research_bot/qualification_v31.py"
      - "scripts/run_v31_drawdown_firewall.py"
      - "tests/test_drawdown_firewall_v31.py"
      - "tests/test_qualification_v31.py"
      - ".github/workflows/v31-drawdown-firewall.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  drawdown-firewall:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install research package
        run: python -m pip install -e '.[dev]'

      - name: Verify allocator, causality and governance invariants
        run: >-
          python -m pytest -q
          tests/test_portfolio_allocator_v25.py
          tests/test_cross_venue_robustness_v27.py
          tests/test_evidence_governance_v29.py
          tests/test_regime_event_alpha_v30.py
          tests/test_drawdown_firewall_v31.py
          tests/test_qualification_v31.py

      - name: Download frozen v0.30 development evidence
        uses: actions/download-artifact@v4
        with:
          name: v30-regime-event-alpha
          path: frozen-v30
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34632401230

      - name: Run v0.31 paired firewall tournament and untouched holdout
        run: >-
          python scripts/run_v31_drawdown_firewall.py
          --v30-artifact-dir frozen-v30
          --output-dir artifacts/v31-drawdown-firewall

      - name: Print v0.31 preregistration
        run: cat artifacts/v31-drawdown-firewall/preregistration_v31.json

      - name: Print v0.31 development lock
        run: cat artifacts/v31-drawdown-firewall/development_lock_v31.json

      - name: Print v0.31 decision
        run: cat artifacts/v31-drawdown-firewall/decision_v31.json

      - name: Print top paired rows
        run: |
          python - <<'PY'
          import pandas as pd
          p = 'artifacts/v31-drawdown-firewall/development_summary_v31.csv'
          x = pd.read_csv(p)
          cols = [
              'strategy','timeframe','family','development_eligible_v27',
              'coinex_trades','coinex_profit_factor','coinex_expectancy_r','coinex_max_drawdown',
              'okx_trades','okx_profit_factor','okx_expectancy_r','okx_max_drawdown',
              'robust_floor_block_ci_low_v27','robust_floor_breadth_v27',
              'coinex_firewall_scaled_trades','okx_firewall_scaled_trades',
          ]
          print(x[cols].head(12).to_string(index=False))
          PY

      - name: Upload v0.31 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v31-drawdown-firewall
          path: artifacts/v31-drawdown-firewall
          retention-days: 90
