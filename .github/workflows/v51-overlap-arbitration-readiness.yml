name: v0.51 Prospective Arbitration Readiness

on:
  push:
    branches:
      - research/v51-overlap-arbitration-empirical
    paths:
      - "research_bot/overlap_arbitration_v51.py"
      - "scripts/collect_v51_prospective_ohlcv.py"
      - "tests/test_overlap_arbitration_v51.py"
      - "tests/test_v51_prospective_collector.py"
      - "docs/V51_OVERLAP_CONFLICT_ARBITRATION_PREREGISTRATION.md"
      - "docs/V51_OVERLAP_ARBITRATION_RESEARCH_2026-09-13.md"
      - ".github/workflows/v51-overlap-arbitration-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v51-readiness-${{ github.ref }}
  cancel-in-progress: false

env:
  V51_PREREG_HEAD: d8ee4576aaf55750dd5910cc0d3b2efcbba3f5b2
  V51_CALENDAR_HEAD: 6a8fa49de2d1befa9c17049aa61e13da20a028eb
  V50_RESULT_HEAD: 776f42664f3b01f9deac235fc611c5d84746d74f
  V47_SCIENTIFIC_HEAD: 802b0cde38549617589b6a4a313949361dd9425c
  V51_PREREG_EPOCH: "1789274968"
  V51_CALENDAR_EPOCH: "1789275171"

jobs:
  readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify prospective lineage and frozen design
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$V50_RESULT_HEAD" HEAD
          git merge-base --is-ancestor "$V51_PREREG_HEAD" HEAD
          git merge-base --is-ancestor "$V51_CALENDAR_HEAD" HEAD
          # Compare immutable instants numerically, independent of ISO timezone formatting.
          test "$(git show -s --format=%ct "$V51_PREREG_HEAD")" = "$V51_PREREG_EPOCH"
          test "$(git show -s --format=%ct "$V51_CALENDAR_HEAD")" = "$V51_CALENDAR_EPOCH"
          # No post-freeze edit to the frozen policy/calendar files is permitted.
          git diff --exit-code "$V51_CALENDAR_HEAD" -- \
            docs/V51_OVERLAP_CONFLICT_ARBITRATION_PREREGISTRATION.md \
            research_bot/overlap_arbitration_v51.py \
            tests/test_overlap_arbitration_v51.py

      - name: Verify inherited v0.47 scientific pipeline unchanged
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            research_bot/economic_state_v46.py \
            research_bot/probability_calibration_v47.py \
            scripts/run_v47_probability_calibration.py \
            scripts/run_v39_development_characterization.py \
            scripts/run_v39_development_characterization_corrected.py
          do
            test "$(git rev-parse HEAD:"$path")" = "$(git rev-parse "$V47_SCIENTIFIC_HEAD":"$path")"
          done

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python - <<'PY'
          import sys, ccxt, pandas, sklearn
          assert sys.version_info[:2] == (3, 11)
          print({"python": sys.version.split()[0], "ccxt": ccxt.__version__, "pandas": pandas.__version__, "sklearn": sklearn.__version__})
          PY

      - name: Run frozen v0.51 causal arbitration tests
        run: pytest -q tests/test_overlap_arbitration_v51.py

      - name: Run prospective collector invariants
        run: pytest -q tests/test_v51_prospective_collector.py

      - name: Run inherited regression suite
        run: |
          pytest -q \
            tests/test_expected_r_utility_mapping_v50.py \
            tests/test_probability_calibration_v47.py \
            tests/test_economic_state_v46.py

      - name: Verify research-only safety contract
        run: |
          python - <<'PY'
          from research_bot.overlap_arbitration_v51 import (
              ALLOWED_VENUES_V51,
              PROSPECTIVE_START_V51,
              ARBITRATION_POLICY_V51,
          )
          from scripts.collect_v51_prospective_ohlcv import (
              ALLOWED_VENUES_V51 as COLLECTOR_VENUES,
              PROSPECTIVE_START_V51 as COLLECTOR_START,
          )
          assert ARBITRATION_POLICY_V51 == "SIMULTANEOUS_MAX_EXPECTED_R_NO_PREEMPTION"
          assert set(ALLOWED_VENUES_V51) == {"coinex", "okx", "kucoin"}
          assert tuple(COLLECTOR_VENUES) == ("coinex", "okx", "kucoin")
          assert "kraken" not in ALLOWED_VENUES_V51
          assert PROSPECTIVE_START_V51 == COLLECTOR_START
          print({
              "policy": ARBITRATION_POLICY_V51,
              "prospective_start": str(PROSPECTIVE_START_V51),
              "kraken_touched": False,
              "paper_execution": False,
              "live_execution": False,
          })
          PY
