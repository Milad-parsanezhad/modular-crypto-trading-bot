name: v0.46 Economic-State Representation Valid Development

on:
  pull_request:
    paths:
      - 'research_bot/economic_state_v46.py'
      - 'scripts/run_v46_economic_state_representation.py'
      - 'tests/test_economic_state_v46.py'
      - 'docs/V46_ECONOMIC_STATE_REPRESENTATION_PREREGISTRATION.md'
      - '.github/workflows/v46-economic-state-representation-valid.yml'
  workflow_dispatch:

concurrency:
  group: v46-valid-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  EXPECTED_PREREG_HEAD: 857cfa9673834a18feca25bc20e75f2e94cebdb4
  SOURCE_V44_RUN: '34700944062'

jobs:
  empirical-v46-valid:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact scientific head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact head and corrected prereg lineage
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL=$(git rev-parse HEAD)
          EXPECTED='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$ACTUAL" = "$EXPECTED"
          git cat-file -e "$EXPECTED_PREREG_HEAD^{commit}"
          git merge-base --is-ancestor "$EXPECTED_PREREG_HEAD" "$ACTUAL"
          grep -q 'PREREGISTERED BEFORE VALID v0.46 EMPIRICAL EXECUTION' docs/V46_ECONOMIC_STATE_REPRESENTATION_PREREGISTRATION.md
          grep -q 'common frozen three-state space' docs/V46_ECONOMIC_STATE_REPRESENTATION_PREREGISTRATION.md

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip

      - name: Install package and test runner
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
          pip check

      - name: Run frozen v0.46 tests
        run: pytest -q tests/test_economic_state_v46.py

      - name: Download exact canonical v0.44 prepared evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: v44-prepared-data
          path: work/v44
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_V44_RUN }}

      - name: Verify source artifact and fail-closed guards
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('work/v44')
          required=['events_v44.pkl.gz','fold_index_v44.csv','prepared_hashes_v44.json','prep_status_v44.json']
          for name in required:
              assert (root/name).is_file(), name
          hashes=json.loads((root/'prepared_hashes_v44.json').read_text())
          got=hashlib.sha256((root/'events_v44.pkl.gz').read_bytes()).hexdigest()
          assert got == hashes['events_v44_pickle_sha256']
          status=json.loads((root/'prep_status_v44.json').read_text())
          assert status['status']=='READY'
          assert status['kraken_touched'] is False
          assert status['paper_execution'] is False
          assert status['live_execution'] is False
          PY

      - name: Execute corrected frozen v0.46 ablation
        run: |
          python scripts/run_v46_economic_state_representation.py \
            --input-dir work/v44 \
            --output-dir results/v46_economic_state

      - name: Verify canonical output contract
        shell: bash
        run: |
          set -euo pipefail
          for f in decision_v46.json support_manifest_v46.csv forecast_metrics_v46.csv reliability_bins_v46.csv training_state_values_v46.csv oos_predictions_v46.csv.gz post_governor_trades_v46.csv.gz fold_economics_v46.csv output_hashes_v46.json; do
            test -f "results/v46_economic_state/$f"
          done
          python - <<'PY'
          import json
          d=json.load(open('results/v46_economic_state/decision_v46.json'))
          assert d['cross_arm_metric_space']=='TARGET_STOP_TIME_COMMON_SPACE'
          assert d['kraken_touched'] is False
          assert d['paper_execution'] is False
          assert d['live_execution'] is False
          assert d['post_result_threshold_tuning'] is False
          assert d['post_result_asset_pruning'] is False
          assert d['decision'] in {'V46_DEVELOPMENT_CANDIDATE','V46_REPRESENTATION_REJECT_OR_INSUFFICIENT_EVIDENCE'}
          PY

      - name: Write execution provenance
        shell: bash
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          out=Path('results/v46_economic_state')
          p={
            'workflow_run_id': os.environ.get('GITHUB_RUN_ID'),
            'workflow_attempt': os.environ.get('GITHUB_RUN_ATTEMPT'),
            'head_sha': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
            'corrected_prereg_head': os.environ['EXPECTED_PREREG_HEAD'],
            'source_v44_run': int(os.environ['SOURCE_V44_RUN']),
            'supersedes_pre_correction_v46_runs': True,
            'kraken_touched': False,
            'paper_execution': False,
            'live_execution': False,
          }
          (out/'execution_provenance_v46.json').write_text(json.dumps(p,indent=2,sort_keys=True))
          PY

      - name: Upload canonical v0.46 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v46-economic-state-representation-valid
          path: results/v46_economic_state/
          if-no-files-found: error
          retention-days: 90
