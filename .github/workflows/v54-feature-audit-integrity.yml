name: v54-feature-audit-integrity

on:
  pull_request:
    paths:
      - 'research_bot/feature_audit_v54.py'
      - 'research_bot/multitimeframe_v53.py'
      - 'scripts/run_v54_feature_audit.py'
      - 'tests/test_feature_audit_v54.py'
      - 'docs/V54_FEATURE_AUDIT_PROTOCOL.md'
      - '.github/workflows/v54-feature-audit-integrity.yml'
  push:
    branches: ['research/v54-feature-audit-oos']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v54-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Compile v0.54 modules
        run: |
          python -m compileall -q research_bot scripts tests
      - name: Focused v0.53/v0.54 causal tests
        run: |
          pytest -q \
            tests/test_v53_candle_zone_mtf.py \
            tests/test_v53_confluence_forward.py \
            tests/test_v53_confluence_missing.py \
            tests/test_feature_audit_v54.py
      - name: Full repository suite
        run: pytest -q
      - name: Audit safety contract
        run: |
          ! grep -R -nE 'LIVE_EXECUTION *= *[Tt]rue|PAPER_EXECUTION *= *[Tt]rue' \
            research_bot/feature_audit_v54.py scripts/run_v54_feature_audit.py docs/V54_FEATURE_AUDIT_PROTOCOL.md
          python - <<'PY'
          from pathlib import Path
          src = Path('research_bot/multitimeframe_v53.py').read_text()
          assert 'decision_time_col="decision_at"' in src
          assert 'shift(-26)' not in src
          runner = Path('scripts/run_v54_feature_audit.py').read_text()
          assert 'PaperExecutionEngine' not in runner
          print('v0.54 safety/integrity contract preserved')
          PY
