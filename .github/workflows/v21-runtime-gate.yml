name: v21-runtime-meta-gate

on:
  pull_request:
    paths:
      - "research_bot/meta_gate_v21.py"
      - "tests/test_meta_gate_v21.py"
      - ".github/workflows/v21-runtime-gate.yml"
  workflow_dispatch:

jobs:
  runtime-gate-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Fail-closed ML runtime gate tests
        run: pytest -q tests/test_meta_gate_v21.py
