name: v33-breadth-stability

on:
  push:
    branches: ["research/v33-breadth-stability"]
    paths:
      - "research_bot/breadth_stability_v33.py"
      - "scripts/run_v33_breadth_stability.py"
      - "tests/test_breadth_stability_v33.py"
      - ".github/workflows/v33-breadth-stability.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  breadth-stability:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install research package
        run: python -m pip install -e '.[dev]'
      - name: Verify v0.33 invariants
        run: python -m pytest -q tests/test_breadth_stability_v33.py tests/test_drawdown_firewall_v31.py tests/test_qualification_v31.py
      - name: Download frozen v0.30 snapshots
        uses: actions/download-artifact@v4
        with:
          name: v30-regime-event-alpha
          path: frozen-v30
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34632401230
      - name: Download consumed v0.31 KuCoin evidence
        uses: actions/download-artifact@v4
        with:
          name: v31-drawdown-firewall
          path: frozen-v31
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34633572528
      - name: Run v0.33 three-venue development screen
        run: python scripts/run_v33_breadth_stability.py --v30-artifact-dir frozen-v30 --v31-artifact-dir frozen-v31 --output-dir artifacts/v33-breadth-stability
      - name: Print lock and decision
        run: |
          cat artifacts/v33-breadth-stability/development_lock_v33.json
          cat artifacts/v33-breadth-stability/decision_v33.json
      - name: Upload v0.33 evidence
        uses: actions/upload-artifact@v4
        with:
          name: v33-breadth-stability
          path: artifacts/v33-breadth-stability
          retention-days: 90
