name: v42 Breadth Cluster CI

on:
  pull_request:
    branches:
      - research/v41-event-competing-risk
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-v42:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run v0.42 invariants and cache equivalence
        run: |
          pytest -q tests/test_breadth_cluster_v42.py tests/test_v41_vectorized_equivalence.py tests/test_v42_cache_equivalence.py tests/test_cli_v41.py

      - name: Compile all frozen and checkpointed v0.42 runners
        run: |
          python -m py_compile scripts/run_v42_breadth_cluster_characterization.py
          python -m py_compile scripts/run_v42_breadth_cluster_characterization_fast.py
          python -m py_compile scripts/prepare_v42_breadth_data.py
          python -m py_compile scripts/run_v42_fold_from_prepared.py
          python -m py_compile scripts/finalize_v42_from_folds.py

      - name: Run bot doctor
        run: modular-crypto-bot doctor

      - name: Verify v0.42 manifest
        run: |
          modular-crypto-bot manifest --version v42 > /tmp/v42_manifest.json
          python - <<'PY'
          import json
          m=json.load(open('/tmp/v42_manifest.json'))
          assert m['reserved_holdout']=='kraken'
          assert m['kraken_touched'] is False
          assert m['paper_execution'] is False
          assert m['live_execution'] is False
          assert m['threshold_relaxation'] is False
          assert m['family_pruning'] is False
          assert m['minimum_common_symbols'] == 18
          PY
