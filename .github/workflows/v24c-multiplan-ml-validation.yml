name: v24c-multiplan-ml-validation

on:
  push:
    branches: [research/v24c-multiplan-ml-validation]
    paths:
      - "research_bot/evidence_ladder_v24c.py"
      - "tests/test_evidence_ladder_v24c.py"
      - "docs/V24C_MULTIPLAN_ML_VALIDATION_PROTOCOL.md"
      - ".github/workflows/v24c-multiplan-ml-validation.yml"
  pull_request:
    paths:
      - "research_bot/evidence_ladder_v24c.py"
      - "tests/test_evidence_ladder_v24c.py"
      - "docs/V24C_MULTIPLAN_ML_VALIDATION_PROTOCOL.md"
      - ".github/workflows/v24c-multiplan-ml-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "1"

jobs:
  protocol-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout immutable experiment SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
          clean: true
          persist-credentials: false
      - name: Verify source provenance
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: python -m pip install --no-cache-dir -e '.[dev]'
      - name: Dependency integrity
        run: python -m pip check
      - name: Run v0.24c anti-leakage and plan-routing tests
        run: |
          pytest -q \
            tests/test_evidence_ladder_v24c.py \
            tests/test_strategy_meta_v24.py \
            tests/test_strategy_family_meta_v24b.py \
            tests/test_ml_framework_v23r.py \
            tests/test_ml_audit_v23r.py \
            tests/test_ml_meta_v21.py \
            tests/test_meta_gate_v21.py
      - name: Emit frozen v0.24c protocol manifest
        run: |
          mkdir -p artifacts/v24c-protocol
          python - <<'PY'
          import json, pathlib
          from research_bot.evidence_ladder_v24c import protocol_manifest
          root = pathlib.Path('artifacts/v24c-protocol')
          m = protocol_manifest()
          assert m['forward_paper_authorized'] is False
          assert m['live_execution_authorized'] is False
          (root / 'protocol_manifest.json').write_text(json.dumps(m, indent=2), encoding='utf-8')
          PY
      - name: Persist exact CI provenance
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess
          root = pathlib.Path('artifacts/v24c-protocol')
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          expected = os.environ['EXPECTED_SHA']
          assert actual == expected
          (root / 'ci_provenance.json').write_text(json.dumps({
              'expected_sha': expected,
              'actual_sha': actual,
              'run_id': os.environ.get('GITHUB_RUN_ID'),
              'workflow': os.environ.get('GITHUB_WORKFLOW'),
              'status': 'EXACT_EXPERIMENT_SHA_VERIFIED',
          }, indent=2), encoding='utf-8')
          PY
          python -m pip freeze --all > artifacts/v24c-protocol/pip-freeze.txt
      - name: Upload protocol evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v24c-protocol-${{ github.run_id }}
          path: artifacts/v24c-protocol/
          if-no-files-found: error
          retention-days: 30
