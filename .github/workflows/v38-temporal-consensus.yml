name: v38-temporal-consensus

on:
  push:
    branches: [research/v38-temporal-consensus]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  temporal-consensus-development:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install research package
        run: python -m pip install -e '.[dev]'
      - name: Verify v0.38 and inherited fail-closed invariants
        run: |
          python -m pytest -q \
            tests/test_temporal_consensus_v38.py \
            tests/test_event_utility_v36.py \
            tests/test_kraken_holdout_v34.py
      - name: Download frozen v0.36 evidence
        uses: actions/download-artifact@v4
        with:
          name: v36-expected-netr
          path: frozen-v36
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: parsa314/modular-crypto-trading-bot
          run-id: 34641575923
      - name: Download Kraken seal evidence
        uses: actions/download-artifact@v4
        with:
          name: v34-kraken-holdout
          path: frozen-v34
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: parsa314/modular-crypto-trading-bot
          run-id: 34635635582
      - name: Run v0.38 temporal-consensus development screen
        run: |
          python scripts/run_v38_temporal_consensus.py \
            --v36-artifact-dir frozen-v36 \
            --v34-artifact-dir frozen-v34 \
            --output-dir artifacts/v38-temporal-consensus
      - name: Print v0.38 evidence
        run: |
          cat artifacts/v38-temporal-consensus/decision_v38.json
          python - <<'PY'
          import pandas as pd
          print(pd.read_csv('artifacts/v38-temporal-consensus/development_summary_v38.csv').to_string(index=False))
          PY
      - name: Upload v0.38 evidence
        uses: actions/upload-artifact@v4
        with:
          name: v38-temporal-consensus
          path: artifacts/v38-temporal-consensus
          retention-days: 90
