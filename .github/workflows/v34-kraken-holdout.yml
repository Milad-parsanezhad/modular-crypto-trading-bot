name: ARCHIVED v34 Kraken Holdout — DISABLED

# Historical workflow retained as a visible fail-closed guard.
# The original v0.34 implementation targeted the old v0.33 candidate and is
# scientifically obsolete for the current v0.43+ lineage. Kraken is reserved
# and MUST NOT be fetched until a new preregistered development winner explicitly
# authorizes a one-shot holdout under a new experiment ID.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived-guard:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    steps:
      - name: Kraken remains sealed
        run: |
          echo "ARCHIVED: v0.34 Kraken holdout is disabled."
          echo "Create a NEW preregistered holdout workflow only after a current development winner passes every frozen gate."
          exit 1
