name: v25-portfolio-allocator-tournament

on:
  pull_request:
    paths:
      - "research_bot/portfolio_allocator_v25.py"
      - "research_bot/causal_evaluation_v25.py"
      - "scripts/run_v25_portfolio_allocator_tournament.py"
      - "tests/test_portfolio_allocator_v25.py"
      - ".github/workflows/v25-portfolio-allocator-tournament.yml"
  push:
    branches:
      - "research/v20-global-strategy-risk-lab"
    paths:
      - "research_bot/portfolio_allocator_v25.py"
      - "research_bot/causal_evaluation_v25.py"
      - "scripts/run_v25_portfolio_allocator_tournament.py"
      - "tests/test_portfolio_allocator_v25.py"
      - ".github/workflows/v25-portfolio-allocator-tournament.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  portfolio-allocator-tournament:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install research package
        run: python -m pip install -e '.[dev]'
      - name: Lock v0.25 allocator invariants
        run: >-
          python -m pytest -q
          tests/test_risk_causality_v23.py
          tests/test_portfolio_exposure_v24.py
          tests/test_portfolio_allocator_v25.py
      - name: Download frozen v0.20 evidence
        uses: actions/download-artifact@v4
        with:
          name: v20-global-strategy-risk-lab
          path: frozen-v20
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34482338133
      - name: Run v0.25 dev-validation tournament
        run: >-
          python scripts/run_v25_portfolio_allocator_tournament.py
          --v20-artifact-dir frozen-v20
          --output-dir artifacts/v25-portfolio-allocator-tournament
      - name: Print v0.25 decision
        run: cat artifacts/v25-portfolio-allocator-tournament/decision_v25.json
      - name: Print H4 S6 controlled comparison
        run: cat artifacts/v25-portfolio-allocator-tournament/h4_s6_v23_vs_v25.json
      - name: Upload v0.25 tournament evidence
        uses: actions/upload-artifact@v4
        with:
          name: v25-portfolio-allocator-tournament
          path: artifacts/v25-portfolio-allocator-tournament
          retention-days: 30
