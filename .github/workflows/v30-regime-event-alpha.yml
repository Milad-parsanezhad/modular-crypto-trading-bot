name: v30-regime-event-alpha

on:
  push:
    branches:
      - "research/v30-regime-event-alpha"
    paths:
      - "research_bot/regime_event_alpha_v30.py"
      - "research_bot/qualification_v30.py"
      - "scripts/run_v30_regime_event_tournament.py"
      - "tests/test_regime_event_alpha_v30.py"
      - ".github/workflows/v30-regime-event-alpha.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  regime-event-tournament:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install research package
        run: python -m pip install -e '.[dev]'

      - name: Verify causal and governance invariants
        run: >-
          python -m pytest -q
          tests/test_portfolio_allocator_v25.py
          tests/test_cross_venue_robustness_v27.py
          tests/test_evidence_governance_v29.py
          tests/test_regime_event_alpha_v30.py

      - name: Run v0.30 consumed-development tournament and untouched holdout
        run: >-
          python scripts/run_v30_regime_event_tournament.py
          --output-dir artifacts/v30-regime-event-alpha

      - name: Print v0.30 preregistration
        run: cat artifacts/v30-regime-event-alpha/preregistration_v30.json

      - name: Print v0.30 development lock
        run: cat artifacts/v30-regime-event-alpha/development_lock_v30.json

      - name: Print v0.30 decision
        run: cat artifacts/v30-regime-event-alpha/decision_v30.json

      - name: Print top development rows
        run: |
          python - <<'PY'
          import pandas as pd
          p = 'artifacts/v30-regime-event-alpha/development_summary_v30.csv'
          x = pd.read_csv(p)
          cols = [
              'strategy','timeframe','family','development_eligible_v27',
              'coinex_trades','coinex_profit_factor','coinex_expectancy_r','coinex_max_drawdown',
              'okx_trades','okx_profit_factor','okx_expectancy_r','okx_max_drawdown',
              'robust_floor_block_ci_low_v27','robust_floor_breadth_v27',
          ]
          print(x[cols].head(12).to_string(index=False))
          PY

      - name: Upload v0.30 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v30-regime-event-alpha
          path: artifacts/v30-regime-event-alpha
          retention-days: 90
