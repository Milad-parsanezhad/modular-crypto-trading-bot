name: v17-strategy-lab

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "1"

jobs:
  causal-strategy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout immutable event SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
          clean: true
          persist-credentials: false
      - name: Verify checkout provenance
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install lightweight strategy-test dependencies
        run: python -m pip install --no-cache-dir -e '.[dev]'
      - name: Dependency integrity
        run: python -m pip check
      - name: Test v0.17 causal strategy, paper adapter and active CI hardening
        run: |
          pytest -q \
            tests/test_strategy_lab_v17.py \
            tests/test_binance_spot_archive_v17.py \
            tests/test_forward_candidate_v17.py \
            tests/test_workflow_hardening_v23r.py
