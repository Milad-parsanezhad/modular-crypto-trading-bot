name: v23r-ml-rebuild-audit

on:
  push:
    branches: [research/v23-ml-rebuild-audit2]
    paths:
      - "pyproject.toml"
      - "research_bot/ml_framework_v23r.py"
      - "research_bot/ml_audit_v23r.py"
      - "research_bot/external_ml_replication_v23r.py"
      - "scripts/run_v23r_ml_rebuild_audit.py"
      - "scripts/run_v23r_external_ml_replication.py"
      - "tests/test_ml_framework_v23r.py"
      - "tests/test_ml_audit_v23r.py"
      - "tests/test_ml_audit_v23r_regressions.py"
      - "tests/test_external_ml_replication_v23r.py"
      - "research_bot/ict_localization_v22c.py"
      - "research_bot/multimodal_fusion_v22d.py"
      - "research_bot/scientific_liquidity_wyckoff_v22d.py"
      - "tests/test_ict_localization_v22c.py"
      - "tests/test_multimodal_fusion_v22d.py"
      - "tests/test_scientific_liquidity_wyckoff_v22d.py"
      - "tests/test_deep_temporal_v22.py"
      - "docs/V23R_ML_REBUILD_AUDIT_PROTOCOL.md"
      - ".github/workflows/v23r-ml-rebuild-audit.yml"
  pull_request:
    paths:
      - "pyproject.toml"
      - "research_bot/ml_framework_v23r.py"
      - "research_bot/ml_audit_v23r.py"
      - "research_bot/external_ml_replication_v23r.py"
      - "scripts/run_v23r_ml_rebuild_audit.py"
      - "scripts/run_v23r_external_ml_replication.py"
      - "tests/test_ml_framework_v23r.py"
      - "tests/test_ml_audit_v23r.py"
      - "tests/test_ml_audit_v23r_regressions.py"
      - "tests/test_external_ml_replication_v23r.py"
      - "research_bot/ict_localization_v22c.py"
      - "research_bot/multimodal_fusion_v22d.py"
      - "research_bot/scientific_liquidity_wyckoff_v22d.py"
      - "tests/test_ict_localization_v22c.py"
      - "tests/test_multimodal_fusion_v22d.py"
      - "tests/test_scientific_liquidity_wyckoff_v22d.py"
      - "tests/test_deep_temporal_v22.py"
      - "docs/V23R_ML_REBUILD_AUDIT_PROTOCOL.md"
      - ".github/workflows/v23r-ml-rebuild-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  EXPECTED_REF: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "1"

jobs:
  dependency-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout immutable event SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
          clean: true
          persist-credentials: false
      - name: Verify checkout provenance
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install core research dependencies without deep shared cache
        run: python -m pip install --no-cache-dir -e '.[dev]'
      - name: Validate dependency graph
        run: |
          python -m pip check
          mkdir -p artifacts/dependency-integrity
          python --version > artifacts/dependency-integrity/python-version.txt
          python -m pip freeze --all > artifacts/dependency-integrity/pip-freeze.txt
          git rev-parse HEAD > artifacts/dependency-integrity/git-head.txt
      - name: Upload dependency manifest
        uses: actions/upload-artifact@v7
        with:
          name: v23r-dependency-integrity-${{ github.run_id }}
          path: artifacts/dependency-integrity/
          retention-days: 30

  upstream-evidence-integrity:
    needs: dependency-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout immutable event SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
          clean: true
          persist-credentials: false
      - name: Verify checkout provenance
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install isolated deep/vision test dependencies
        run: python -m pip install --no-cache-dir -e '.[dev,deep]'
      - name: Validate deep dependency graph
        run: python -m pip check
      - name: Re-run localization, multimodal and temporal upstream integrity
        run: |
          pytest -q \
            tests/test_ict_localization_v22c.py \
            tests/test_scientific_liquidity_wyckoff_v22d.py \
            tests/test_multimodal_fusion_v22d.py \
            tests/test_deep_temporal_v22.py \
            tests/test_vision_ablation_v22b.py \
            tests/test_vision_ict_v22.py

  deterministic-audit-tests:
    needs: dependency-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout immutable event SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
          clean: true
          persist-credentials: false
      - name: Verify checkout provenance
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install audit dependencies without deep cache
        run: python -m pip install --no-cache-dir -e '.[dev]'
      - name: Dependency integrity
        run: python -m pip check
      - name: Run clean ML framework, leakage, external-freeze and audit regressions
        run: |
          pytest -q \
            tests/test_ml_framework_v23r.py \
            tests/test_ml_audit_v23r.py \
            tests/test_ml_audit_v23r_regressions.py \
            tests/test_external_ml_replication_v23r.py \
            tests/test_ml_meta_v21.py \
            tests/test_meta_gate_v21.py \
            tests/test_unsupervised_v22.py

  real-data-panel-audit:
    needs: [deterministic-audit-tests, upstream-evidence-integrity]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      internal_candidate: ${{ steps.internal_decision.outputs.internal_candidate }}
    steps:
      - name: Checkout immutable event SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
          clean: true
          persist-credentials: false
      - name: Verify checkout provenance
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install lightweight real-data dependencies
        run: python -m pip install --no-cache-dir -e '.[dev]'
      - name: Validate dependency graph
        run: python -m pip check
      - name: Run broad CoinEx 4h causal ML panel audit
        run: |
          PYTHONPATH=. python scripts/run_v23r_ml_rebuild_audit.py \
            --output-dir artifacts/v23r-ml-rebuild-audit \
            --symbols BTC/USDT,ETH/USDT,SOL/USDT,XRP/USDT,DOGE/USDT,ADA/USDT,LINK/USDT,LTC/USDT,BCH/USDT,TRX/USDT,AVAX/USDT,DOT/USDT \
            --bars 2600
      - name: Persist immutable CI provenance and dependency freeze
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          python - <<'PY'
          import json, os, pathlib, subprocess
          out = pathlib.Path("artifacts/v23r-ml-rebuild-audit")
          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          expected = os.environ["EXPECTED_SHA"]
          assert actual == expected, (actual, expected)
          payload = {
              "expected_sha": expected, "actual_sha": actual,
              "expected_ref": os.environ.get("EXPECTED_REF"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "workflow": os.environ.get("GITHUB_WORKFLOW"),
              "repository": os.environ.get("GITHUB_REPOSITORY"),
              "status": "EXACT_EVENT_SHA_VERIFIED",
          }
          (out / "ci_provenance.json").write_text(json.dumps(payload, indent=2), encoding="utf-8")
          PY
          python -m pip freeze --all > artifacts/v23r-ml-rebuild-audit/pip-freeze.txt
      - name: Fail closed on data-audit or unsafe execution flags
        run: |
          python - <<'PY'
          import json, pathlib
          d = json.loads(pathlib.Path("artifacts/v23r-ml-rebuild-audit/decision.json").read_text(encoding="utf-8"))
          assert d["dataset_audit"]["decision"] == "AUDIT_PASS", d["dataset_audit"]
          assert not d.get("live_execution_authorized", False), d
          assert not d.get("forward_paper_authorized", False), d
          assert not d.get("supervised", {}).get("live_execution_authorized", False), d.get("supervised")
          champion = d.get("validation_champion_artifact")
          assert champion is not None, "validation-frozen champion artifact missing"
          assert champion.get("fit_segment") == "development_only"
          assert champion.get("selection_segment") == "validation_only"
          assert champion.get("test_used_for_refit") is False
          PY
      - name: Export internal research-candidate decision
        id: internal_decision
        run: |
          python - <<'PY'
          import json, os, pathlib
          d = json.loads(pathlib.Path("artifacts/v23r-ml-rebuild-audit/decision.json").read_text(encoding="utf-8"))
          is_candidate = d.get("supervised", {}).get("decision") == "ML_RESEARCH_CANDIDATE"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"internal_candidate={'true' if is_candidate else 'false'}\n")
          print({"internal_candidate": is_candidate, "decision": d.get("supervised", {}).get("decision")})
          PY
      - name: Upload broad-panel audit, frozen champion and ML evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v23r-ml-rebuild-audit-${{ github.run_id }}
          path: artifacts/v23r-ml-rebuild-audit/
          if-no-files-found: error
          retention-days: 30

  external-venue-replication:
    needs: real-data-panel-audit
    if: needs.real-data-panel-audit.outputs.internal_candidate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout immutable event SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
          clean: true
          persist-credentials: false
      - name: Verify checkout provenance
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install lightweight external-replication dependencies
        run: python -m pip install --no-cache-dir -e '.[dev]'
      - name: Dependency integrity
        run: python -m pip check
      - name: Download the exact internal-run frozen champion
        uses: actions/download-artifact@v8
        with:
          name: v23r-ml-rebuild-audit-${{ github.run_id }}
          path: internal-evidence
      - name: Run no-refit/no-retuning OKX 4h venue replication
        run: |
          PYTHONPATH=. python scripts/run_v23r_external_ml_replication.py \
            --internal-artifact internal-evidence \
            --output-dir artifacts/v23r-external-ml-replication \
            --exchange okx \
            --symbols BTC/USDT,ETH/USDT,SOL/USDT,XRP/USDT,DOGE/USDT,ADA/USDT,LINK/USDT,LTC/USDT,BCH/USDT,TRX/USDT,AVAX/USDT,DOT/USDT \
            --bars 2200 \
            --min-selected 100 \
            --min-symbols 5
      - name: Verify frozen external semantics and persist CI provenance
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess
          root = pathlib.Path("artifacts/v23r-external-ml-replication")
          d = json.loads((root / "external_decision.json").read_text(encoding="utf-8"))
          assert d["threshold_tuned_on_external"] is False, d
          assert d["model_refit_on_external"] is False, d
          assert d["requires_strategy_level_risk_backtest"] is True, d
          assert d["forward_paper_authorized"] is False, d
          assert d["live_execution_authorized"] is False, d
          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert actual == os.environ["EXPECTED_SHA"]
          (root / "ci_provenance.json").write_text(json.dumps({
              "expected_sha": os.environ["EXPECTED_SHA"], "actual_sha": actual,
              "run_id": os.environ.get("GITHUB_RUN_ID"), "status": "EXACT_EVENT_SHA_VERIFIED"
          }, indent=2), encoding="utf-8")
          PY
      - name: Upload external replication evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v23r-external-ml-replication-${{ github.run_id }}
          path: artifacts/v23r-external-ml-replication/
          if-no-files-found: error
          retention-days: 30

  final-evidence-gate:
    needs: [real-data-panel-audit, external-venue-replication]
    if: always() && needs.real-data-panel-audit.result == 'success' && (needs.external-venue-replication.result == 'success' || needs.external-venue-replication.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout immutable event SHA
        uses: actions/checkout@v7
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
          clean: true
          persist-credentials: false
      - name: Verify checkout provenance
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Download exact-run internal research evidence
        uses: actions/download-artifact@v8
        with:
          name: v23r-ml-rebuild-audit-${{ github.run_id }}
          path: downloaded-evidence
      - name: Download external evidence when internal candidate exists
        if: needs.real-data-panel-audit.outputs.internal_candidate == 'true'
        uses: actions/download-artifact@v8
        with:
          name: v23r-external-ml-replication-${{ github.run_id }}
          path: downloaded-external
      - name: Validate artifact completeness, provenance, panel breadth and conditional external replication
        env:
          INTERNAL_CANDIDATE: ${{ needs.real-data-panel-audit.outputs.internal_candidate }}
        run: |
          python - <<'PY'
          import csv, json, os, pathlib
          root = pathlib.Path("downloaded-evidence")
          required = [
              "decision.json", "labeled_dataset.csv", "provenance.json",
              "supervised_per_seed_leaderboard.csv", "unsupervised_diagnostics.csv",
              "validation_champion.joblib", "validation_champion_manifest.json",
              "ci_provenance.json", "pip-freeze.txt",
          ]
          missing = [name for name in required if not (root / name).exists() or (root / name).stat().st_size == 0]
          assert not missing, f"missing/empty research evidence: {missing}"

          ci = json.loads((root / "ci_provenance.json").read_text(encoding="utf-8"))
          assert ci["expected_sha"] == os.environ["EXPECTED_SHA"], ci
          assert ci["actual_sha"] == os.environ["EXPECTED_SHA"], ci

          provenance = json.loads((root / "provenance.json").read_text(encoding="utf-8"))
          successful = [s for s, v in provenance.items() if isinstance(v, dict) and "rows" in v and int(v["rows"]) >= 500]
          assert len(successful) >= 8, f"broad panel requirement failed: only {len(successful)} usable symbols: {successful}"

          with (root / "labeled_dataset.csv").open("r", encoding="utf-8", newline="") as fh:
              rows = sum(1 for _ in csv.reader(fh)) - 1
          assert rows >= 5000, f"insufficient labeled panel rows: {rows}"

          decision = json.loads((root / "decision.json").read_text(encoding="utf-8"))
          assert decision["dataset_audit"]["decision"] == "AUDIT_PASS"
          assert decision.get("live_execution_authorized") is False
          assert decision.get("forward_paper_authorized") is False
          assert decision.get("supervised", {}).get("live_execution_authorized") is False

          internal_candidate = os.environ.get("INTERNAL_CANDIDATE", "false") == "true"
          external_summary = "SKIPPED_NO_INTERNAL_CANDIDATE"
          if internal_candidate:
              eroot = pathlib.Path("downloaded-external")
              erequired = ["external_decision.json", "external_predictions.csv", "external_provenance.json", "ci_provenance.json"]
              emiss = [name for name in erequired if not (eroot / name).exists() or (eroot / name).stat().st_size == 0]
              assert not emiss, f"missing external evidence: {emiss}"
              ext = json.loads((eroot / "external_decision.json").read_text(encoding="utf-8"))
              eci = json.loads((eroot / "ci_provenance.json").read_text(encoding="utf-8"))
              assert eci["actual_sha"] == os.environ["EXPECTED_SHA"], eci
              assert ext["threshold_tuned_on_external"] is False
              assert ext["model_refit_on_external"] is False
              assert ext["live_execution_authorized"] is False
              external_summary = ext["decision"]

          print(json.dumps({
              "final_ci_gate": "PASS",
              "exact_sha": ci["actual_sha"],
              "usable_symbols": len(successful),
              "labeled_rows": rows,
              "ml_decision": decision.get("supervised", {}).get("decision"),
              "external_replication": external_summary,
              "live_execution_authorized": False,
          }, indent=2))
          PY
