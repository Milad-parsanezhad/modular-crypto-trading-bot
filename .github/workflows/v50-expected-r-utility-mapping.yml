name: v0.50 Expected-R Utility Mapping Diagnostic

on:
  pull_request:
    paths:
      - 'research_bot/expected_r_utility_mapping_v50.py'
      - 'scripts/run_v50_expected_r_utility_mapping.py'
      - 'tests/test_expected_r_utility_mapping_v50.py'
      - 'docs/V50_EXPECTED_R_UTILITY_MAPPING_PREREGISTRATION.md'
      - 'docs/V50_EXPECTED_R_UTILITY_MAPPING_RESEARCH_2026-09-12.md'
      - '.github/workflows/v50-expected-r-utility-mapping.yml'
  workflow_dispatch:

concurrency:
  group: v50-utility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  EXPECTED_PREREG_HEAD: 9b3f8d1bda650cc93af7b6cc69f162ae30d64cac
  CANONICAL_V47_HEAD: 802b0cde38549617589b6a4a313949361dd9425c
  SOURCE_V44_RUN: '34700944062'
  SOURCE_V47_RUN: '34705324352'

jobs:
  diagnostic-v50:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact scientific head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact head and frozen prereg lineage
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL=$(git rev-parse HEAD)
          EXPECTED='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$ACTUAL" = "$EXPECTED"
          git cat-file -e "$EXPECTED_PREREG_HEAD^{commit}"
          git merge-base --is-ancestor "$EXPECTED_PREREG_HEAD" "$ACTUAL"
          grep -q 'PREREGISTERED BEFORE ANY v0.50 EMPIRICAL EXECUTION' docs/V50_EXPECTED_R_UTILITY_MAPPING_PREREGISTRATION.md
          grep -q 'V49_CONDITIONAL_INSTABILITY_NOT_SUPPORTED' docs/V49_RESULTS_2026-09-12.md

      - name: Verify inherited v0.47 scientific pipeline is unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code "$CANONICAL_V47_HEAD" HEAD -- \
            research_bot/economic_state_v46.py \
            research_bot/probability_calibration_v47.py \
            scripts/run_v47_probability_calibration.py \
            scripts/run_v47_probability_calibration_compat.py \
            scripts/run_v39_development_characterization.py \
            scripts/run_v39_development_characterization_corrected.py

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip

      - name: Install package and test runner
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
          pip check
          python - <<'PY'
          import numpy, pandas, scipy, sklearn
          print('numpy', numpy.__version__)
          print('pandas', pandas.__version__)
          print('scipy', scipy.__version__)
          print('sklearn', sklearn.__version__)
          PY

      - name: Run frozen v0.50 tests
        run: pytest -q tests/test_expected_r_utility_mapping_v50.py tests/test_economic_state_v46.py

      - name: Download exact canonical v0.44 prepared evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: v44-prepared-data
          path: work/v44
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_V44_RUN }}

      - name: Download exact canonical v0.47 evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: v47-probability-calibration
          path: work/v47
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_V47_RUN }}

      - name: Verify source artifacts and safety guards
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          v44=Path('work/v44')
          for name in ['events_v44.pkl.gz','fold_index_v44.csv','prepared_hashes_v44.json','prep_status_v44.json']:
              assert (v44/name).is_file(), name
          h=json.loads((v44/'prepared_hashes_v44.json').read_text())
          got=hashlib.sha256((v44/'events_v44.pkl.gz').read_bytes()).hexdigest()
          assert got == h['events_v44_pickle_sha256']
          s=json.loads((v44/'prep_status_v44.json').read_text())
          assert s['status']=='READY'
          assert s['kraken_touched'] is False
          assert s['paper_execution'] is False
          assert s['live_execution'] is False

          v47=Path('work/v47')
          for name in ['decision_v47.json','execution_provenance_v47.json','support_manifest_v47.csv','oos_predictions_v47.csv.gz','post_governor_trades_v47.csv.gz','fold_economics_v47.csv','output_hashes_v47.json']:
              assert (v47/name).is_file(), name
          p=json.loads((v47/'execution_provenance_v47.json').read_text())
          assert int(p['workflow_run_id']) == 34705324352
          assert p['head_sha'] == '802b0cde38549617589b6a4a313949361dd9425c'
          assert p['kraken_touched'] is False
          d=json.loads((v47/'decision_v47.json').read_text())
          assert d['arms']['C1_TEMPERATURE_R1']['supported_asset_folds'] == 120
          PY

      - name: Execute frozen v0.50 diagnostic
        run: |
          python scripts/run_v50_expected_r_utility_mapping.py \
            --v44-dir work/v44 \
            --v47-dir work/v47 \
            --output-dir results/v50_expected_r_utility_mapping

      - name: Write execution provenance
        shell: bash
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          out=Path('results/v50_expected_r_utility_mapping')
          p={
            'workflow_run_id': os.environ.get('GITHUB_RUN_ID'),
            'workflow_attempt': os.environ.get('GITHUB_RUN_ATTEMPT'),
            'head_sha': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
            'prereg_head': os.environ['EXPECTED_PREREG_HEAD'],
            'source_v44_run': int(os.environ['SOURCE_V44_RUN']),
            'source_v47_run': int(os.environ['SOURCE_V47_RUN']),
            'canonical_v47_head': os.environ['CANONICAL_V47_HEAD'],
            'primary_expected_r_source': 'EXACT_CANONICAL_V47_C1_ARTIFACT_NO_REFIT',
            'test_labels_used_for_model_or_calibrator_fit': False,
            'candidate_promotion_allowed': False,
            'kraken_touched': False,
            'paper_execution': False,
            'live_execution': False,
          }
          (out/'execution_provenance_v50.json').write_text(json.dumps(p,indent=2,sort_keys=True))
          PY

      - name: Verify canonical output contract
        shell: bash
        run: |
          set -euo pipefail
          for f in decision_v50.json state_utility_transport_v50.csv state_utility_detail_v50.csv expected_r_ranking_v50.csv ranking_fold_summary_v50.csv fold_direction_tests_v50.csv pipeline_stages_v50.csv context_decomposition_v50.csv output_hashes_v50.json execution_provenance_v50.json; do
            test -f "results/v50_expected_r_utility_mapping/$f"
          done
          python - <<'PY'
          import json
          d=json.load(open('results/v50_expected_r_utility_mapping/decision_v50.json'))
          assert d['candidate_promotion_allowed'] is False
          assert d['canonical_governor_counts_reproduced'] is True
          assert d['primary_expected_r_source']=='EXACT_CANONICAL_V47_C1_ARTIFACT_NO_REFIT'
          assert d['kraken_touched'] is False
          assert d['paper_execution'] is False
          assert d['live_execution'] is False
          assert d['post_result_threshold_tuning'] is False
          assert d['post_result_pruning'] is False
          assert d['decision'] in {
            'V50_STATE_UTILITY_TRANSPORT_FAILURE_SUPPORTED',
            'V50_EXPECTED_R_RANKING_FAILURE_SUPPORTED',
            'V50_EXPECTED_R_ADMISSION_FAILURE_SUPPORTED',
            'V50_NONOVERLAP_FAILURE_SUPPORTED',
            'V50_GOVERNOR_FAILURE_SUPPORTED',
            'V50_MIXED_UTILITY_PIPELINE_FAILURE_SUPPORTED',
            'V50_UTILITY_MAPPING_EVIDENCE_INCONCLUSIVE',
          }
          PY

      - name: Upload canonical v0.50 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v50-expected-r-utility-mapping
          path: results/v50_expected_r_utility_mapping/
          if-no-files-found: error
          retention-days: 90
