name: v39 Development Characterization

on:
  pull_request:
    branches:
      - research/v39r-canonical-reconstruction
  workflow_dispatch:

jobs:
  characterize-v39:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Verify frozen preregistration exists
        run: |
          test -f docs/V39_DEVELOPMENT_PREREGISTRATION.md
          test -f docs/V39_DEVELOPMENT_PREREGISTRATION_AMENDMENT_1.md

      - name: Re-run v0.39 invariant tests
        run: |
          pytest -q tests/test_financial_system_v39.py tests/test_mother_strategy_v39.py

      - name: Compile characterization runner
        run: python -m py_compile scripts/run_v39_development_characterization.py

      - name: Run frozen v0.39 development characterization
        run: |
          python scripts/run_v39_development_characterization.py \
            --output-dir results/v39_characterization

      - name: Upload v0.39 development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v39-development-characterization
          path: results/v39_characterization/
          if-no-files-found: error
          retention-days: 90
