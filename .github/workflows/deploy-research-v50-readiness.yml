name: v0.50 Research Deployment Readiness

on:
  pull_request:
    paths:
      - 'research_bot/service.py'
      - 'tests/test_service_deploy_v50.py'
      - 'pyproject.toml'
      - 'railway.toml'
      - '.github/workflows/deploy-research-v50-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip

      - name: Install deployment dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          pip check

      - name: Run deployment smoke tests
        env:
          LIVE_EXECUTION: 'false'
          PAPER_EXECUTION: 'false'
        run: pytest -q tests/test_service_deploy_v50.py

      - name: Verify fail-closed import guard
        run: |
          set +e
          LIVE_EXECUTION=true PAPER_EXECUTION=false python -c 'import research_bot.service' >/tmp/guard.out 2>/tmp/guard.err
          code=$?
          set -e
          test "$code" -ne 0
          grep -q 'Execution firewall violation' /tmp/guard.err

      - name: Verify Railway configuration
        run: |
          grep -q 'research_bot.service:app' railway.toml
          grep -q 'healthcheckPath = "/health"' railway.toml
