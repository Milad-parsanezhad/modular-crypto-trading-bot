name: v0.45 Label Representation Diagnostic

on:
  pull_request:
    branches:
      - research/v45-post-v44-decision-policy
    paths:
      - 'docs/V44_RESULTS_2026-09-12.md'
      - 'docs/V45_ROUTE_SELECTION_2026-09-12.json'
      - 'docs/V45_LABEL_REPRESENTATION_DIAGNOSTIC_PREREGISTRATION.md'
      - 'research_bot/label_representation_diagnostic_v45.py'
      - 'scripts/run_v45_label_representation_diagnostic.py'
      - 'tests/test_v45_label_representation_diagnostic.py'
      - '.github/workflows/v45-label-representation-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: v45-label-representation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  diagnostic-v45:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      V44_RUN_ID: '34700944062'
    steps:
      - name: Checkout exact scientific head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Assert checkout provenance and frozen preregistration
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL=$(git rev-parse HEAD)
          echo "expected=$EXPECTED_HEAD_SHA actual=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED_HEAD_SHA"
          test "$(git hash-object docs/V45_LABEL_REPRESENTATION_DIAGNOSTIC_PREREGISTRATION.md)" = "3cf704d363e99976fdec9a9d9708e67970bf5737"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
          cache: pip

      - name: Install research package and test runner
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e . pytest
          pip check

      - name: Run frozen v0.45 diagnostic tests
        shell: bash
        run: |
          set -euo pipefail
          pytest -q tests/test_v45_label_representation_diagnostic.py
          python -m py_compile research_bot/label_representation_diagnostic_v45.py scripts/run_v45_label_representation_diagnostic.py

      - name: Download exact v0.44 prepared evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: v44-prepared-data
          path: work/prepared
          github-token: ${{ github.token }}
          repository: parsa314/modular-crypto-trading-bot
          run-id: 34700944062

      - name: Download exact v0.44 canonical final evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: v44-information-driven-sampling-characterization
          path: work/final
          github-token: ${{ github.token }}
          repository: parsa314/modular-crypto-trading-bot
          run-id: 34700944062

      - name: Run frozen Route-C diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_v45_label_representation_diagnostic.py \
            --prepared-dir work/prepared \
            --final-dir work/final \
            --output-dir results/v45_label_representation

      - name: Verify fail-closed diagnostic outputs
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            diagnostic_summary_v45.json \
            label_distribution_v45.csv \
            cause_age_hazard_v45.csv \
            calibration_decomposition_v45.csv \
            calibration_bins_v45.csv \
            feature_information_v45.csv \
            timeout_diagnostics_v45.csv \
            source_integrity_v45.json; do
            test -s "results/v45_label_representation/$f"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('results/v45_label_representation')
          s = json.loads((p/'diagnostic_summary_v45.json').read_text())
          i = json.loads((p/'source_integrity_v45.json').read_text())
          assert s['state'] == 'DIAGNOSTIC_COMPLETE_NO_PROMOTION'
          assert s['promotion_authorized'] is False
          assert s['kraken_touched'] is False
          assert s['paper_execution'] is False
          assert s['live_execution'] is False
          assert i['source_run_id'] == 34700944062
          assert i['source_head_sha'] == '5efb843d385d194c549a69dc4b2fd38d56ab906c'
          assert i['common_fold_count'] == 5
          assert i['events_v44_pickle_sha256'] == i['expected_events_v44_pickle_sha256']
          PY

      - name: Record v0.45 execution provenance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, platform, subprocess
          from pathlib import Path
          out = Path('results/v45_label_representation')
          record = {
              'workflow_run_id': os.environ.get('GITHUB_RUN_ID'),
              'workflow_event': os.environ.get('GITHUB_EVENT_NAME'),
              'checked_out_sha': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(),
              'expected_head_sha': os.environ['EXPECTED_HEAD_SHA'],
              'v44_source_run_id': 34700944062,
              'v44_source_head_sha': '5efb843d385d194c549a69dc4b2fd38d56ab906c',
              'python': platform.python_version(),
              'preregistration_git_blob': subprocess.check_output(['git','hash-object','docs/V45_LABEL_REPRESENTATION_DIAGNOSTIC_PREREGISTRATION.md'], text=True).strip(),
              'kraken_touched': False,
              'paper_execution': False,
              'live_execution': False,
          }
          (out/'execution_provenance_v45.json').write_text(json.dumps(record, indent=2, sort_keys=True))
          PY

      - name: Upload canonical v0.45 diagnostic evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v45-label-representation-diagnostic
          path: results/v45_label_representation/
          if-no-files-found: error
          retention-days: 90
