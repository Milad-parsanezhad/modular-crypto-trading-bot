name: v43 Preregistration CI

on:
  pull_request:
    branches:
      - research/v42-breadth-cluster-robust
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prereg-v43:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Verify v0.43 preregistration exists
        run: test -f docs/V43_ASSET_CROSSVENUE_PREREGISTRATION.md

      - name: Run v0.43 pre-empirical invariants
        run: pytest -q tests/test_asset_crossvenue_v43.py

      - name: Compile v0.43 module
        run: python -m py_compile research_bot/asset_crossvenue_v43.py

      - name: Verify fail-closed v0.43 manifest
        run: |
          python - <<'PY'
          from research_bot.asset_crossvenue_v43 import preregistration_manifest_v43
          m=preregistration_manifest_v43()
          assert m['reserved_holdout']=='kraken'
          assert m['kraken_touched'] is False
          assert m['paper_execution'] is False
          assert m['live_execution'] is False
          assert m['threshold_relaxation'] is False
          assert m['outcome_based_asset_pruning'] is False
          assert m['transformer_or_rl_added'] is False
          PY

      - name: Enforce preregistration-only state
        run: |
          test ! -f scripts/run_v43_empirical_characterization.py
          echo 'v0.43 empirical execution intentionally blocked until v0.42 final decision is frozen.'
