name: v20-ict-m1-causal-lab

on:
  workflow_dispatch:
  push:
    branches: [main, research-v20-ict-m1]
    paths:
      - "research_bot/ict_m1_v20.py"
      - "scripts/run_ict_m1_lab_v20.py"
      - "tests/test_ict_m1_v20.py"
      - "notebooks/Research_Bot_v0_20_ICT_M1_Colab.ipynb"
      - "docs/V20_ICT_M1_STRATEGY_PROTOCOL_AND_RESULTS.md"
      - ".github/workflows/v20-ict-m1.yml"
  pull_request:
    branches: [main]
    paths:
      - "research_bot/ict_m1_v20.py"
      - "scripts/run_ict_m1_lab_v20.py"
      - "tests/test_ict_m1_v20.py"
      - "notebooks/Research_Bot_v0_20_ICT_M1_Colab.ipynb"
      - "docs/V20_ICT_M1_STRATEGY_PROTOCOL_AND_RESULTS.md"
      - ".github/workflows/v20-ict-m1.yml"

permissions:
  contents: read

jobs:
  causal-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Causal ICT/M1 regression and CLI integration tests
        run: pytest -q tests/test_ict_m1_v20.py
