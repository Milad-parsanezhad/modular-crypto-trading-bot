name: v28-fresh-temporal-oos

on:
  push:
    branches:
      - "research/v28-fresh-temporal-oos"
    paths:
      - "research_bot/fresh_temporal_oos_v28.py"
      - "scripts/run_v28_fresh_temporal_oos.py"
      - "tests/test_fresh_temporal_oos_v28.py"
      - ".github/workflows/v28-fresh-temporal-oos.yml"
  workflow_dispatch:
    inputs:
      v27_run_id:
        description: "Completed v0.27 workflow run ID containing v27-cross-venue-robustness artifact"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  preregistration-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install research package
        run: python -m pip install -e '.[dev]'

      - name: Verify v0.28 preregistered logic
        run: >-
          python -m pytest -q
          tests/test_risk_causality_v23.py
          tests/test_portfolio_allocator_v25.py
          tests/test_cross_venue_robustness_v27.py
          tests/test_fresh_temporal_oos_v28.py

  fresh-temporal-oos:
    if: github.event_name == 'workflow_dispatch'
    needs: preregistration-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install research package
        run: python -m pip install -e '.[dev]'

      - name: Download completed v0.27 evidence
        uses: actions/download-artifact@v4
        with:
          name: v27-cross-venue-robustness
          path: frozen-v27
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.v27_run_id }}

      - name: Run strictly post-lock temporal OOS
        run: >-
          python scripts/run_v28_fresh_temporal_oos.py
          --v27-artifact-dir frozen-v27
          --output-dir artifacts/v28-fresh-temporal-oos

      - name: Print v0.28 decision
        run: cat artifacts/v28-fresh-temporal-oos/decision_v28.json

      - name: Upload v0.28 evidence
        uses: actions/upload-artifact@v4
        with:
          name: v28-fresh-temporal-oos
          path: artifacts/v28-fresh-temporal-oos
          retention-days: 30
