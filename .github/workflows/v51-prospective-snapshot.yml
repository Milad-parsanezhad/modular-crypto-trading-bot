name: v0.51 Prospective Raw Snapshot

on:
  push:
    branches: ["research/v51-overlap-arbitration-empirical"]
    paths: [".github/workflows/v51-prospective-snapshot.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch official public just-closed 4h candles
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          ASSETS=['BTC','ETH','SOL','XRP','DOGE']
          now=datetime.now(timezone.utc)
          close=now.replace(minute=0,second=0,microsecond=0)
          close=close-timedelta(hours=close.hour%4)
          opened=close-timedelta(hours=4)
          if not (0 <= (now-close).total_seconds() <= 3600):
              raise SystemExit('outside frozen capture-lag window')

          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'v51-research-collector/1.0'})
              with urllib.request.urlopen(req,timeout=25) as r:
                  return json.loads(r.read().decode())

          out={'captured_at':now.isoformat(),'bar_open_at':opened.isoformat(),'bar_close_at':close.isoformat(),'rows':[],'errors':[]}
          for a in ASSETS:
              # OKX: [ts,o,h,l,c,vol,volCcy,volQuote,confirm]
              try:
                  u='https://www.okx.com/api/v5/market/history-candles?'+urllib.parse.urlencode({'instId':f'{a}-USDT','bar':'4H','after':str(int(close.timestamp()*1000)),'limit':'2'})
                  z=get(u)
                  found=None
                  for r in z.get('data',[]):
                      ts=datetime.fromtimestamp(int(r[0])/1000,timezone.utc)
                      if ts==opened:
                          found=r; break
                  if found is None: raise RuntimeError('target bar missing')
                  out['rows'].append({'venue':'okx','symbol':a+'USDT','open':found[1],'high':found[2],'low':found[3],'close':found[4],'volume':found[5]})
              except Exception as e: out['errors'].append({'venue':'okx','symbol':a+'USDT','error':type(e).__name__+': '+str(e)})

              # KuCoin: [time,open,close,high,low,volume,turnover]
              try:
                  u='https://api.kucoin.com/api/v1/market/candles?'+urllib.parse.urlencode({'type':'4hour','symbol':f'{a}-USDT','startAt':int(opened.timestamp()),'endAt':int(close.timestamp())})
                  z=get(u)
                  found=None
                  for r in z.get('data',[]):
                      ts=datetime.fromtimestamp(int(r[0]),timezone.utc)
                      if ts==opened:
                          found=r; break
                  if found is None: raise RuntimeError('target bar missing')
                  out['rows'].append({'venue':'kucoin','symbol':a+'USDT','open':found[1],'high':found[3],'low':found[4],'close':found[2],'volume':found[5]})
              except Exception as e: out['errors'].append({'venue':'kucoin','symbol':a+'USDT','error':type(e).__name__+': '+str(e)})

              # CoinEx v2 object response
              try:
                  u='https://api.coinex.com/v2/spot/kline?'+urllib.parse.urlencode({'market':a+'USDT','period':'4hour','start_time':int(opened.timestamp()*1000),'end_time':int(close.timestamp()*1000),'limit':2})
                  z=get(u)
                  found=None
                  for r in z.get('data',[]):
                      ts=datetime.fromtimestamp(int(r['created_at'])/1000,timezone.utc)
                      if ts==opened:
                          found=r; break
                  if found is None: raise RuntimeError('target bar missing')
                  out['rows'].append({'venue':'coinex','symbol':a+'USDT','open':found['open'],'high':found['high'],'low':found['low'],'close':found['close'],'volume':found['volume']})
              except Exception as e: out['errors'].append({'venue':'coinex','symbol':a+'USDT','error':type(e).__name__+': '+str(e)})

          Path('v51_snapshot.json').write_text(json.dumps(out,sort_keys=True,indent=2))
          print(json.dumps({'captured_at':out['captured_at'],'rows':len(out['rows']),'errors':out['errors']},indent=2))
          if len(out['rows']) != 15:
              raise SystemExit('incomplete official venue snapshot')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v51-prospective-snapshot-${{ github.run_id }}
          path: v51_snapshot.json
          retention-days: 7
