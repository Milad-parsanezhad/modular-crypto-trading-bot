name: v38-soft-portfolio
on:
  push:
    branches: [research/v38-soft-portfolio]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  soft-portfolio-development:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install research package
        run: python -m pip install -e '.[dev]'
      - name: Verify v0.38 invariants
        run: python -m pytest -q tests/test_soft_portfolio_v38.py tests/test_event_utility_v36.py tests/test_marginal_utility_v37.py tests/test_kraken_holdout_v34.py
      - name: Download frozen v0.36 event evidence
        uses: actions/download-artifact@v4
        with:
          name: v36-expected-netr
          path: frozen-v36
          github-token: ${{ github.token }}
          repository: parsa314/modular-crypto-trading-bot
          run-id: 34641575923
      - name: Download frozen v0.37 rejection
        uses: actions/download-artifact@v4
        with:
          name: v37-marginal-utility
          path: frozen-v37
          github-token: ${{ github.token }}
          repository: parsa314/modular-crypto-trading-bot
          run-id: 34641699676
      - name: Run v0.38 soft allocation
        run: |
          python scripts/run_v38_soft_portfolio.py \
            --v36-artifact-dir frozen-v36 \
            --v37-artifact-dir frozen-v37 \
            --output-dir artifacts/v38-soft-portfolio
      - name: Print v0.38 evidence
        run: |
          cat artifacts/v38-soft-portfolio/decision_v38.json
          cat artifacts/v38-soft-portfolio/screen_v38.json
      - name: Upload v0.38 evidence
        uses: actions/upload-artifact@v4
        with:
          name: v38-soft-portfolio
          path: artifacts/v38-soft-portfolio
          retention-days: 90
