name: v40 Two-Stage Hurdle CI

on:
  pull_request:
    branches:
      - research/v39-robust-financial-system
  workflow_dispatch:

jobs:
  test-v40-hurdle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run v0.40 hurdle invariants
        run: pytest -q tests/test_two_stage_hurdle_v40.py

      - name: Compile v0.40 runner
        run: python -m py_compile scripts/run_v40_two_stage_characterization.py

      - name: Verify v0.40 governance manifest
        run: |
          python - <<'PY'
          from research_bot.two_stage_hurdle_v40 import preregistration_manifest_v40
          m = preregistration_manifest_v40()
          assert m['kraken_touched'] is False
          assert m['paper_execution'] is False
          assert m['live_execution'] is False
          assert m['stage1_target'] == '1(net_r > 0)'
          print(m)
          PY
