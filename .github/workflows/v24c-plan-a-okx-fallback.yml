name: v24c-plan-a-okx-fallback

on:
  push:
    branches: [research/v24c-multiplan-ml-validation]
    paths:
      - "research_bot/ccxt_external_v24c.py"
      - "scripts/run_v24c_plan_a_fallback_okx.py"
      - ".github/workflows/v24c-plan-a-okx-fallback.yml"
  pull_request:
    paths:
      - "research_bot/ccxt_external_v24c.py"
      - "scripts/run_v24c_plan_a_fallback_okx.py"
      - ".github/workflows/v24c-plan-a-okx-fallback.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "1"

jobs:
  okx-external-fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 1
          clean: true
          persist-credentials: false
      - name: Verify provenance
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --no-cache-dir -e '.[dev]'
      - name: Dependency audit
        run: python -m pip check
      - name: Execute changed-mechanism fallback once
        run: python scripts/run_v24c_plan_a_fallback_okx.py
      - name: Record environment
        if: always()
        run: |
          mkdir -p artifacts/v24c-plan-a-okx-fallback
          printf '%s\n' "${EXPECTED_SHA}" > artifacts/v24c-plan-a-okx-fallback/source_commit.txt
          python -m pip freeze --all > artifacts/v24c-plan-a-okx-fallback/pip-freeze.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v24c-plan-a-okx-fallback-${{ github.run_id }}
          path: artifacts/v24c-plan-a-okx-fallback/
          if-no-files-found: error
          retention-days: 30
