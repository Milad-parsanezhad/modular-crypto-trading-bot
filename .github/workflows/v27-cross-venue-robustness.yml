name: v27-cross-venue-robustness

on:
  pull_request:
    paths:
      - "research_bot/cross_venue_robustness_v27.py"
      - "scripts/run_v27_cross_venue_robustness.py"
      - "tests/test_cross_venue_robustness_v27.py"
      - ".github/workflows/v27-cross-venue-robustness.yml"
  push:
    branches:
      - "research/v20-global-strategy-risk-lab"
    paths:
      - "research_bot/cross_venue_robustness_v27.py"
      - "scripts/run_v27_cross_venue_robustness.py"
      - "tests/test_cross_venue_robustness_v27.py"
      - ".github/workflows/v27-cross-venue-robustness.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  cross-venue-robustness:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install research package
        run: python -m pip install -e '.[dev]'

      - name: Lock causal allocator and v0.27 selection invariants
        run: >-
          python -m pytest -q
          tests/test_risk_causality_v23.py
          tests/test_portfolio_exposure_v24.py
          tests/test_portfolio_allocator_v25.py
          tests/test_replication_monitor_v26.py
          tests/test_cross_venue_robustness_v27.py

      - name: Download frozen CoinEx v0.20 evidence
        uses: actions/download-artifact@v4
        with:
          name: v20-global-strategy-risk-lab
          path: frozen-v20
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 34482338133

      - name: Run v0.27 development robustness and untouched KuCoin holdout
        run: >-
          python scripts/run_v27_cross_venue_robustness.py
          --v20-artifact-dir frozen-v20
          --output-dir artifacts/v27-cross-venue-robustness

      - name: Print development lock
        run: cat artifacts/v27-cross-venue-robustness/development_lock_v27.json

      - name: Print v0.27 decision
        run: cat artifacts/v27-cross-venue-robustness/decision_v27.json

      - name: Print top development rows
        run: python - <<'PY'
          import pandas as pd
          p = 'artifacts/v27-cross-venue-robustness/development_summary_v27.csv'
          x = pd.read_csv(p)
          cols = [
              'strategy','timeframe','development_eligible_v27',
              'coinex_trades','coinex_profit_factor','coinex_expectancy_r','coinex_max_drawdown',
              'okx_trades','okx_profit_factor','okx_expectancy_r','okx_max_drawdown',
              'robust_floor_block_ci_low_v27','robust_floor_breadth_v27',
          ]
          print(x[cols].head(10).to_string(index=False))
          PY

      - name: Upload v0.27 evidence
        uses: actions/upload-artifact@v4
        with:
          name: v27-cross-venue-robustness
          path: artifacts/v27-cross-venue-robustness
          retention-days: 30
