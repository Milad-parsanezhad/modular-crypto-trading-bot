[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modular-crypto-trading-bot"
version = "0.1.0"
description = "Reproducible Ichimoku, ML and RL cryptocurrency trading research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3", "scikit-learn>=1.4,<2", "joblib>=1.3,<2"]

[project.optional-dependencies]
research = ["torch>=2.2,<3", "gymnasium>=1.0,<2", "stable-baselines3>=2.4,<3", "xgboost>=2,<4", "ccxt>=4,<5", "matplotlib>=3.8,<4"]
test = ["pytest>=8,<10"]

[project.scripts]
milad-bot = "milad_trader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
