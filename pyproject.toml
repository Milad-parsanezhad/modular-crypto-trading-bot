[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modular-crypto-research-bot"
version = "1.0.0rc3"
description = "Evidence-driven modular cryptocurrency trading research and monitoring platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "ccxt==4.5.77",
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "scikit-learn>=1.5,<2",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["research_bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
